renderLevelUpOverlay(ctx) {
      const g = this.game;
      const p = g.player;
      const inp = g.input;

      if (!g.levelUpCards || g.levelUpCards.length === 0) {
        g.generateLevelUpCards();
      }

      // Koyu saydam filtre
      ctx.fillStyle = 'rgba(5, 8, 15, 0.92)';
      ctx.fillRect(0, 0, CONFIG.canvas.width, CONFIG.canvas.height);

      // Baslik & Alt Baslik
      ctx.save();
      ctx.fillStyle = '#facc15';
      ctx.font = 'bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#eab308';
      ctx.shadowBlur = 18;
      ctx.fillText('SEVIYE ATLADINIZ! (LV. ' + p.level + ')', CONFIG.canvas.width / 2, 95);
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#94a3b8';
      ctx.font = '15px sans-serif';
      const subHeader = g.levelUpMode === 'perks' 
        ? 'Tum yetenekler maksimum! Bir stat bonusu secin, yenileyin veya pas gecin:' 
        : 'Bir yetenek veya stat bonusu secin (Tus: [1], [2], [3] veya Fare ile Tiklayin)';
      ctx.fillText(subHeader, CONFIG.canvas.width / 2, 132);

      const cards = g.levelUpCards;
      const cardXPositions = [150, 490, 830];

      for (let idx = 0; idx < cards.length; idx++) {
        const c = cards[idx];
        const cx = cardXPositions[idx];
        const isHover = (inp.mouseX >= cx && inp.mouseX <= cx + 300 && inp.mouseY >= 165 && inp.mouseY <= 485);
        const isMax = !c.isPerk && (c.curLvl >= 3);

        if (isHover && !isMax && g.canvas) {
          g.canvas.style.cursor = 'pointer';
        }

        // Kart Arka Plani
        ctx.fillStyle = isHover ? '#1e293b' : '#111827';
        ctx.fillRect(cx, 165, 300, 320);

        // Kenarlik
        ctx.strokeStyle = isMax ? '#64748b' : (isHover ? c.color : '#334155');
        ctx.lineWidth = isHover ? 2.5 : 1.5;
        if (isHover && !isMax) {
          ctx.shadowColor = c.color;
          ctx.shadowBlur = 12;
        }
        ctx.strokeRect(cx, 165, 300, 320);
        ctx.shadowBlur = 0;

        // Tus & Sayi Rozeti
        ctx.fillStyle = c.color;
        ctx.font = 'bold 18px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(c.number + ' ' + c.title, cx + 18, 200);

        ctx.fillStyle = isMax ? '#64748b' : '#38bdf8';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(c.keyBadge, cx + 282, 200);

        // Seviye Gostergesi
        const dotY = 226;
        ctx.textAlign = 'left';

        if (c.isPerk) {
          ctx.fillStyle = '#22c55e';
          ctx.font = 'bold 12px sans-serif';
          ctx.fillText('OZEL STAT BONUSU', cx + 18, dotY);
        } else {
          ctx.fillStyle = '#94a3b8';
          ctx.font = '12px sans-serif';
          ctx.fillText('SEVIYE:', cx + 18, dotY);
          for (let i = 1; i <= 3; i++) {
            ctx.fillStyle = i <= c.curLvl ? c.color : '#374151';
            ctx.beginPath();
            ctx.arc(cx + 80 + i * 22, dotY - 4, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#1e293b';
            ctx.stroke();
          }
          ctx.fillStyle = isMax ? '#eab308' : '#cbd5e1';
          ctx.font = 'bold 12px sans-serif';
          ctx.fillText(isMax ? 'MAX (3/3)' : '(' + c.curLvl + '/3)', cx + 180, dotY);
        }

        // Ayirici cizgi
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx + 18, 246);
        ctx.lineTo(cx + 282, 246);
        ctx.stroke();

        // Aciklama Metni
        ctx.fillStyle = isMax ? '#94a3b8' : '#e2e8f0';
        ctx.font = '13px sans-serif';
        ctx.textAlign = 'left';
        const lines = c.desc.split('\n');
        lines.forEach((line, lIdx) => {
          ctx.fillText(line, cx + 18, 276 + lIdx * 22);
        });

        // Secim Butonu
        const btnY = 430;
        const btnH = 40;
        ctx.fillStyle = isMax ? '#1e293b' : (isHover ? c.color : '#0f172a');
        ctx.fillRect(cx + 18, btnY, 264, btnH);
        ctx.strokeStyle = isMax ? '#475569' : c.color;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(cx + 18, btnY, 264, btnH);

        ctx.fillStyle = isMax ? '#64748b' : (isHover ? '#090d16' : '#ffffff');
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        const btnLabel = isMax ? 'MAKSIMUM SEVIYE' : (isHover ? 'SEC VE AL ' + c.number : 'SEC ' + c.number);
        ctx.fillText(btnLabel, cx + 150, btnY + 25);
      }

      // SKILLERIN ALTINDAKI 2 BUTON: YENILE VE PAS
      const actionBtnY = 512;
      const actionBtnH = 50;

      // 1. YENILE (REROLL) BUTONU (x: 330, w: 290)
      this.drawButton(ctx, 330, actionBtnY, 290, actionBtnH, 'YENILE [R]', '#1e293b', '#38bdf8');

      // 2. PAS GEC (SKIP) BUTONU (x: 660, w: 290)
      this.drawButton(ctx, 660, actionBtnY, 290, actionBtnH, 'PAS GEC [ESC / P]', '#1e293b', '#22c55e');

      // Bilgi / Rehber Alt Metni
      ctx.fillStyle = '#64748b';
      ctx.font = '13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('* Tuslar: [1], [2], [3] Yetenek Sec | [R] Secenekleri Yenile | [ESC / P] Pas Gec ve Can Kazan (+35 HP)', CONFIG.canvas.width / 2, 595);

      ctx.restore();
    }

    drawButton(ctx, x, y, w, h, text, bgColor, borderColor) {
      const isHover = (this.game.input.mouseX >= x && this.game.input.mouseX <= x + w && this.game.input.mouseY >= y && this.game.input.mouseY <= y + h);
      if (isHover && this.game.canvas) {
        this.game.canvas.style.cursor = 'pointer';
      }
      ctx.fillStyle = isHover ? '#334155' : bgColor;
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = isHover ? '#ffffff' : borderColor;
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(text, x + w / 2, y + h / 2 + 5);
    }

    handleScreenClick(mx, my) {
      const g = this.game;

      if (g.state === 'level_up') {
        // Kart 1 (x: 150..450, y: 165..485)
        if (mx >= 150 && mx <= 450 && my >= 165 && my <= 485) {
          g.chooseSkill(0);
          return;
        }
        // Kart 2 (x: 490..790, y: 165..485)
        else if (mx >= 490 && mx <= 790 && my >= 165 && my <= 485) {
          g.chooseSkill(1);
          return;
        }
        // Kart 3 (x: 830..1130, y: 165..485)
        else if (mx >= 830 && mx <= 1130 && my >= 165 && my <= 485) {
          g.chooseSkill(2);
          return;
        }
        // YENÄ°LE (REROLL) Butonu (x: 330..620, y: 512..562)
        else if (mx >= 330 && mx <= 620 && my >= 512 && my <= 562) {
          g.rerollLevelUpSkills();
          return;
        }
        // PAS GEÃ‡ (SKIP) Butonu (x: 660..950, y: 512..562)
        else if (mx >= 660 && mx <= 950 && my >= 512 && my <= 562) {
          g.passLevelUp();
          return;
        }
        return;
      }

      if (g.state === 'settings') {
        const px = 180, py = 50, pw = 920, ph = 620;

        // Kapat [X] butonu
        if (mx >= px + pw - 55 && mx <= px + pw - 15 && my >= py + 16 && my <= py + 52) {
          g.closeSettings();
          return;
        }

        // Tab DeÄŸiÅŸimi
        const tabY = py + 65, tabH = 42;
        if (my >= tabY && my <= tabY + tabH) {
          if (mx >= px + 30 && mx <= px + 290) { this.settingsTab = 'display'; sound.playPickup(); return; }
          if (mx >= px + 310 && mx <= px + 570) { this.settingsTab = 'audio'; sound.playPickup(); return; }
          if (mx >= px + 590 && mx <= px + 890) { this.settingsTab = 'controls'; sound.playPickup(); return; }
        }

        // Alt Kaydet & Geri DÃ¶n
        if (mx >= px + pw / 2 - 180 && mx <= px + pw / 2 + 180 && my >= py + ph - 65 && my <= py + ph - 17) {
          g.closeSettings();
          return;
        }

        // TAB 1: GÃ–RÃœNTÃœ
        if (this.settingsTab === 'display') {
          // [- %5]
          if (mx >= px + 35 && mx <= px + 125 && my >= py + 255 && my <= py + 297) {
            settings.setCameraZoom(settings.cameraZoom - 0.05);
            sound.playPickup();
            return;
          }
          // [+ %5]
          if (mx >= px + 485 && mx <= px + 575 && my >= py + 255 && my <= py + 297) {
            settings.setCameraZoom(settings.cameraZoom + 0.05);
            sound.playPickup();
            return;
          }
          // Presets: 80%, 100%, 120%, 140%
          if (my >= py + 315 && my <= py + 353) {
            if (mx >= px + 35 && mx <= px + 160) { settings.setCameraZoom(0.8); sound.playPickup(); return; }
            if (mx >= px + 175 && mx <= px + 300) { settings.setCameraZoom(1.0); sound.playPickup(); return; }
            if (mx >= px + 315 && mx <= px + 440) { settings.setCameraZoom(1.2); sound.playPickup(); return; }
            if (mx >= px + 455 && mx <= px + 580) { settings.setCameraZoom(1.4); sound.playPickup(); return; }
          }
          // FPS
          if (mx >= px + 280 && mx <= px + 460 && my >= py + 398 && my <= py + 434) {
            this.showFPS = !this.showFPS;
            sound.playPickup();
            return;
          }
          // Screen Shake
          if (mx >= px + 280 && mx <= px + 500 && my >= py + 452 && my <= py + 488) {
            settings.cycleScreenShake();
            sound.playPickup();
            return;
          }
        }

        // TAB 2: SES
        else if (this.settingsTab === 'audio') {
          // Mute toggle
          if (mx >= px + 230 && mx <= px + 490 && my >= py + 215 && my <= py + 257) {
            sound.setEnabled(!sound.enabled);
            settings.saveSettings();
            return;
          }
          // [- %10]
          if (mx >= px + 35 && mx <= px + 125 && my >= py + 315 && my <= py + 357) {
            sound.setVolume(sound.volume - 0.1);
            settings.saveSettings();
            sound.playPickup();
            return;
          }
          // [+ %10]
          if (mx >= px + 485 && mx <= px + 575 && my >= py + 315 && my <= py + 357) {
            sound.setVolume(sound.volume + 0.1);
            settings.saveSettings();
            sound.playPickup();
            return;
          }
          // Presets
          if (my >= py + 375 && my <= py + 411) {
            if (mx >= px + 35 && mx <= px + 115) { sound.setVolume(0); settings.saveSettings(); return; }
            if (mx >= px + 125 && mx <= px + 205) { sound.setVolume(0.25); settings.saveSettings(); sound.playPickup(); return; }
            if (mx >= px + 215 && mx <= px + 295) { sound.setVolume(0.50); settings.saveSettings(); sound.playPickup(); return; }
            if (mx >= px + 305 && mx <= px + 385) { sound.setVolume(0.75); settings.saveSettings(); sound.playPickup(); return; }
            if (mx >= px + 395 && mx <= px + 475) { sound.setVolume(1.0); settings.saveSettings(); sound.playPickup(); return; }
          }
          // Test Audio
          if (mx >= px + 35 && mx <= px + 375 && my >= py + 460 && my <= py + 504) {
            sound.testAudio();
            return;
          }
        }

        // TAB 3: KONTROLLER
        else if (this.settingsTab === 'controls') {
          const col1Actions = ['moveLeft', 'moveRight', 'jump', 'sprint', 'reload', 'pickup'];
          const col2Actions = ['dash', 'shield', 'slot1', 'slot2', 'slot3'];

          // Sol Kolon
          let curY = py + 200;
          for (const act of col1Actions) {
            const btnX = px + 35 + 410 - 130;
            if (mx >= btnX && mx <= btnX + 125 && my >= curY && my <= curY + 34) {
              this.rebindingAction = act;
              sound.playPickup();
              return;
            }
            curY += 44;
          }

          // SaÄŸ Kolon
          curY = py + 200;
          for (const act of col2Actions) {
            const btnX = px + 475 + 410 - 130;
            if (mx >= btnX && mx <= btnX + 125 && my >= curY && my <= curY + 34) {
              this.rebindingAction = act;
              sound.playPickup();
              return;
            }
            curY += 44;
          }

          // VarsayÄ±lana SÄ±fÄ±rla
          if (mx >= px + 35 && mx <= px + 255 && my >= py + 480 && my <= py + 520) {
            settings.resetKeybinds();
            this.rebindingAction = null;
            sound.playPickup();
            return;
          }
        }
        return;
      }

      if (g.state === 'menu') {
        // Hikaye Modu Butonu
        if (mx >= 490 && mx <= 790 && my >= 310 && my <= 362) {
          g.startStoryMode();
        }
        // Sonsuz Mod Butonu
        else if (mx >= 490 && mx <= 790 && my >= 380 && my <= 432) {
          g.startInfiniteMode();
        }
        // Ayarlar Butonu
        else if (mx >= 490 && mx <= 790 && my >= 450 && my <= 502) {
          g.openSettings();
        }
      } else if (g.state === 'story_intro') {
        g.state = 'playing';
        g.camera.snapTo(g.player.x);
        g.waveManager.startWave(1);
      } else if (g.state === 'paused') {
        // Devam Et
        if (mx >= 490 && mx <= 790 && my >= 290 && my <= 338) {
          if (g.waveManager && !g.waveManager.isWaveActive) {
            g.state = 'between_waves';
          } else {
            g.state = (g.stateBeforePause === 'between_waves') ? 'between_waves' : 'playing';
          }
        }
        // Ayarlar
        else if (mx >= 490 && mx <= 790 && my >= 350 && my <= 398) {
          g.openSettings();
        }
        // Yeniden BaÅŸla
        else if (mx >= 490 && mx <= 790 && my >= 410 && my <= 458) g.restartCurrentMode();
        // Ana MenÃ¼
        else if (mx >= 490 && mx <= 790 && my >= 470 && my <= 518) g.state = 'menu';
      } else if (g.state === 'chapter_end') {
        if (mx >= 490 && mx <= 790 && my >= 420 && my <= 472) {
          if (g.chapter >= 3) {
            g.state = 'menu';
          } else {
            g.startNextChapter();
          }
        }
      } else if (g.state === 'game_over') {
        if (mx >= 490 && mx <= 790 && my >= 440 && my <= 492) {
          g.restartCurrentMode();
        } else if (mx >= 490 && mx <= 790 && my >= 510 && my <= 562) {
          g.state = 'menu';
        }
      }
    }
  }

  // ==========================================
  // 13. GAME STATE MACHINE & MAIN LOOP
  // ==========================================
  class Game {
    constructor() {
      this.canvas = document.getElementById('gameCanvas');
      this.ctx = this.canvas.getContext('2d');

      this.state = 'menu'; // menu, story_intro, playing, between_waves, paused, chapter_end, game_over, settings
      this.mode = 'story'; // story, infinite
      this.chapter = 1;
      this.survivalTime = 0;
      this.kills = 0;
      this.score = 0;

      this.settings = (typeof settings !== 'undefined') ? settings : new SettingsManager();
      this.stateBeforeSettings = 'menu';

      this.camera = new Camera();
      if (this.settings) this.camera.zoom = this.settings.cameraZoom;

      this.input = new InputManager(this.canvas);
      this.parallax = new ParallaxBackground();
      this.particles = new ParticleSystem();
      this.player = new Player();
      this.inventory = new Inventory(this.player);
      this.waveManager = new WaveManager();
      this.ui = new UIManager(this);

      this.projectiles = [];
      this.enemies = [];
      this.groundItems = [];
      this.xpOrbs = [];
      this.killsSinceLastWeaponDrop = 0;

      this.lastTime = performance.now();
      this.initLoop();
    }

    startStoryMode() {
      this.mode = 'story';
      this.chapter = 1;
      this.survivalTime = 0;
      this.kills = 0;
      this.score = 0;
      this.resetEntities();
      this.state = 'story_intro';
    }

    startInfiniteMode() {
      this.mode = 'infinite';
      this.chapter = 3; // Gece atmosferi teması
      this.survivalTime = 0;
      this.kills = 0;
      this.score = 0;
      this.resetEntities();
      this.camera.snapTo(this.player.x);
      this.state = 'playing';
      this.waveManager.startWave(1);
    }

    startNextChapter() {
      this.chapter++;
      this.player.x = 2800;
      this.player.hp = this.player.maxHp;
      this.camera.snapTo(this.player.x);
      this.enemies = [];
      this.projectiles = [];
      this.groundItems = [];
      this.xpOrbs = [];
      this.state = 'story_intro';
    }

    restartCurrentMode() {
      if (this.mode === 'story') this.startStoryMode();
      else this.startInfiniteMode();
    }

    resetEntities() {
      this.player = new Player();
      this.inventory = new Inventory(this.player);
      this.waveManager = new WaveManager();
      this.projectiles = [];
      this.enemies = [];
      this.groundItems = [];
      this.xpOrbs = [];
      this.killsSinceLastWeaponDrop = 0;
      this.stateBeforePause = 'playing';
      if (this.camera) this.camera.snapTo(this.player.x);
    }

    togglePause() {
      if (this.state === 'settings') {
        this.closeSettings();
        return;
      }
      if (this.state === 'playing' || this.state === 'between_waves') {
        this.stateBeforePause = this.state;
        this.state = 'paused';
      } else if (this.state === 'paused') {
        if (this.waveManager && !this.waveManager.isWaveActive) {
          this.state = 'between_waves';
        } else {
          this.state = (this.stateBeforePause === 'between_waves') ? 'between_waves' : 'playing';
        }
      }
    }

    openSettings() {
      this.stateBeforeSettings = this.state;
      this.state = 'settings';
      sound.playPickup();
    }

    closeSettings() {
      this.ui.rebindingAction = null;
      if (typeof settings !== 'undefined') settings.saveSettings();
      this.state = this.stateBeforeSettings || 'menu';
      sound.playPickup();
    }

    completeChapter() {
      this.state = 'chapter_end';
      sound.playWaveStart();
    }

    setGameOver() {
      this.state = 'game_over';
      sound.playExplosion();

      // Infinite modda en iyi süreyi localStorage'a kaydet
      if (this.mode === 'infinite') {
        try {
          const prev = localStorage.getItem('survival_best_time');
          const prevSec = prev ? parseInt(prev, 10) : 0;
          if (this.survivalTime > prevSec) {
            localStorage.setItem('survival_best_time', Math.floor(this.survivalTime).toString());
          }
        } catch (e) {
          // localStorage kısıtlı ortamlarda sessizce geç
        }
      }
    }

    dropItemToGround(item, fromSlot) {
      this.groundItems.push(new GroundItem(this.player.x, item));
      this.inventory.setItemToSlot(fromSlot, null);
      this.inventory.cleanOverflownSlots();
      this.particles.addFloatingText('Eşya yere atıldı', this.player.x, this.player.y - 40, '#cbd5e1');
      sound.playItemUse();
    }

    tryPickupGroundItem() {
      let closestIdx = -1;
      let minDist = CONFIG.player.pickupRange;

      for (let i = 0; i < this.groundItems.length; i++) {
        const gi = this.groundItems[i];
        const dist = Math.abs(this.player.x - gi.x);
        if (dist <= minDist) {
          minDist = dist;
          closestIdx = i;
        }
      }

      if (closestIdx !== -1) {
        const gi = this.groundItems[closestIdx];
        const item = gi.item;

        // Mermiler doğrudan yedek cephaneye eklenir
        if (item.type === 'ammo') {
          this.player.ammo[item.ammoType] = (this.player.ammo[item.ammoType] || 0) + item.amount;
          this.particles.addFloatingText(`+${item.amount} ${item.name}`, this.player.x, this.player.y - 45, '#22c55e');
          sound.playPickup();
          this.groundItems.splice(closestIdx, 1);
          return;
        }

        // Medkitler yığınlanarak (stack) envantere alınır
        if (item.type === 'medkit') {
          const initialCount = item.count || 1;
          const added = this.inventory.addItem(item);
          if (added) {
            const pickedCount = initialCount - (item.count || 0);
            this.particles.addFloatingText(`+${pickedCount > 1 ? pickedCount + 'x ' : ''}${item.name}`, this.player.x, this.player.y - 45, CONFIG.rarityColors[item.rarity]);
            sound.playPickup();
            if ((item.count || 0) <= 0) {
              this.groundItems.splice(closestIdx, 1);
            }
          } else {
            this.particles.addFloatingText('Envanter dolu!', this.player.x, this.player.y - 45, '#ef4444');
            sound.playEmptyClick();
          }
          return;
        }

        // Silahlar: Eğer el slotlarından biri boşsa doğrudan el yuvasına tak
        if (item.type === 'weapon') {
          let emptyHand = -1;
          for (let h = 0; h < 3; h++) {
            if (!this.player.handSlots[h]) {
              emptyHand = h;
              break;
            }
          }
          if (emptyHand !== -1) {
            this.player.handSlots[emptyHand] = item;
            const rColor = CONFIG.rarityColors[item.rarity] || '#ffffff';
            this.particles.addFloatingText(`✓ ${item.name} El Yuvası ${emptyHand + 1}'e Alındı!`, this.player.x, this.player.y - 45, rColor);
            sound.playItemUse();
            this.groundItems.splice(closestIdx, 1);
            return;
          }
        }

        // Diğer eşyalar envantere alınır
        const added = this.inventory.addItem(item);
        if (added) {
          this.particles.addFloatingText(`+ ${item.name}`, this.player.x, this.player.y - 45, CONFIG.rarityColors[item.rarity]);
          sound.playPickup();
          this.groundItems.splice(closestIdx, 1);
        } else {
          this.particles.addFloatingText('Envanter dolu!', this.player.x, this.player.y - 45, '#ef4444');
          sound.playEmptyClick();
        }
      }
    }

    getAmmoForWeapon(ammoType, wave, isBig = false) {
      let baseAmounts = {
        pistol: 20 + Math.min(25, wave * 3),
        rifle: 40 + Math.min(60, wave * 6),
        shotgun: 12 + Math.min(16, wave * 2),
        rocket: 3 + Math.min(4, Math.floor(wave / 2))
      };
      let amt = baseAmounts[ammoType] || 25;
      if (isBig) amt = Math.round(amt * 1.6);
      return {
        type: 'ammo',
        ammoType: ammoType,
        name: CONFIG.ammoTypes[ammoType].name,
        amount: amt,
        rarity: ammoType === 'rocket' ? 'rare' : (ammoType === 'rifle' ? 'uncommon' : 'common')
      };
    }

    getSmartAmmoDrop(wave, isBig = false) {
      // Oyuncunun elindeki veya çantasındaki silahları kontrol et
      const owned = new Set();
      if (this.player && this.player.handSlots) {
        for (let i = 0; i < 3; i++) {
          const wp = this.player.handSlots[i];
          if (wp && wp.subType === 'gun') owned.add(wp.ammoType);
        }
      }
      if (this.inventory && this.inventory.grid) {
        for (const item of this.inventory.grid) {
          if (item && item.type === 'weapon' && item.subType === 'gun') owned.add(item.ammoType);
        }
      }

      // Öncelikli ağırlıklar
      const weights = { pistol: 15, rifle: 15, shotgun: 15, rocket: 8 };
      // Sahip olunan silahlara devasa ağırlık bonusu ekle (böylece mermisiz kalmaz)
      for (const t of owned) {
        weights[t] = (weights[t] || 15) + 40;
      }

      // Dalga bazlı çeşitlendirme
      if (wave >= 2) weights.rifle += 25;
      if (wave >= 3) { weights.shotgun += 20; weights.rocket += 15; }
      if (wave >= 4) { weights.rocket += 20; weights.rifle += 20; }

      const totalWeight = Object.values(weights).reduce((a, b) => a + b, 0);
      let rand = Math.random() * totalWeight;
      let chosenType = 'pistol';
      for (const [t, w] of Object.entries(weights)) {
        if (rand < w) {
          chosenType = t;
          break;
        }
        rand -= w;
      }

      return this.getAmmoForWeapon(chosenType, wave, isBig);
    }

    getRandomWeaponForWave(wave) {
      let pool = [];
      if (wave <= 1) {
        // Dalga 1: Pompalı, Çelik Kılıç, Katana, erken M4A1
        pool = [
          { wp: CONFIG.firearms.shotgun, weight: 35 },
          { wp: CONFIG.meleeWeapons.steel_sword, weight: 30 },
          { wp: CONFIG.meleeWeapons.katana, weight: 25 },
          { wp: CONFIG.firearms.m4a1, weight: 10 }
        ];
      } else if (wave === 2) {
        // Dalga 2: M4A1 & Pompalı ağırlıklı
        pool = [
          { wp: CONFIG.firearms.m4a1, weight: 35 },
          { wp: CONFIG.firearms.shotgun, weight: 30 },
          { wp: CONFIG.meleeWeapons.katana, weight: 20 },
          { wp: CONFIG.meleeWeapons.steel_sword, weight: 15 }
        ];
      } else if (wave === 3) {
        // Dalga 3: M4A1, Pompalı, Savaş Kılıcı, ilk Roket Atar şansı
        pool = [
          { wp: CONFIG.firearms.m4a1, weight: 35 },
          { wp: CONFIG.firearms.shotgun, weight: 25 },
          { wp: CONFIG.meleeWeapons.katana, weight: 20 },
          { wp: CONFIG.meleeWeapons.war_sword, weight: 15 },
          { wp: CONFIG.firearms.rocket_launcher, weight: 5 }
        ];
      } else if (wave === 4) {
        // Dalga 4: M4A1, Roket Atar, Pompalı, Savaş Kılıcı
        pool = [
          { wp: CONFIG.firearms.m4a1, weight: 30 },
          { wp: CONFIG.firearms.rocket_launcher, weight: 30 },
          { wp: CONFIG.firearms.shotgun, weight: 20 },
          { wp: CONFIG.meleeWeapons.war_sword, weight: 15 },
          { wp: CONFIG.meleeWeapons.katana, weight: 5 }
        ];
      } else {
        // Dalga 5+ ve sonraki Bölümler / Infinite modu: Ağır cephaneler
        pool = [
          { wp: CONFIG.firearms.rocket_launcher, weight: 30 },
          { wp: CONFIG.firearms.m4a1, weight: 30 },
          { wp: CONFIG.meleeWeapons.war_sword, weight: 20 },
          { wp: CONFIG.meleeWeapons.legendary_sword, weight: 15 },
          { wp: CONFIG.firearms.shotgun, weight: 5 }
        ];
      }

      const totalWeight = pool.reduce((acc, cur) => acc + cur.weight, 0);
      let rand = Math.random() * totalWeight;
      for (const entry of pool) {
        if (rand < entry.weight) {
          const item = { ...entry.wp };
          if (item.subType === 'gun') item.currentMag = item.magSize;
          return item;
        }
        rand -= entry.weight;
      }
      const fallback = { ...CONFIG.firearms.m4a1 };
      fallback.currentMag = fallback.magSize;
      return fallback;
    }

    spawnDrop(x, enemyType = 'zombie') {
      let isBoss = (enemyType === 'boss');
      let isTank = (enemyType === 'tank');
      let isShooter = (enemyType === 'shooter');
      let isRunner = (enemyType === 'runner');
      if (typeof enemyType === 'boolean') {
        isBoss = enemyType;
        enemyType = isBoss ? 'boss' : 'zombie';
      }

      const wave = (this.waveManager && this.waveManager.currentWave) ? this.waveManager.currentWave : 1;
      this.killsSinceLastWeaponDrop = (this.killsSinceLastWeaponDrop || 0) + 1;

      // 1. BOSS DROPLARI (Bölüm sonu bossu - Garanti 4 adet değerli ganimet)
      if (isBoss) {
        this.killsSinceLastWeaponDrop = 0;
        // 1. Garanti Yüksek Seviye Silah (M4A1, Roket Atar, Efsanevi Kılıç, Savaş Kılıcı)
        const bossWeapons = [
          CONFIG.firearms.rocket_launcher,
          CONFIG.firearms.m4a1,
          CONFIG.meleeWeapons.legendary_sword,
          CONFIG.meleeWeapons.war_sword
        ];
        const chosenWp = { ...bossWeapons[Math.floor(Math.random() * bossWeapons.length)] };
        if (chosenWp.subType === 'gun') chosenWp.currentMag = chosenWp.magSize;
        this.groundItems.push(new GroundItem(x - 45, chosenWp));

        // 2. Silaha Uygun Büyük Mermi Paketi
        if (chosenWp.subType === 'gun') {
          const ammoAmounts = { rifle: 80, rocket: 6, pistol: 45, shotgun: 24 };
          this.groundItems.push(new GroundItem(x - 15, {
            type: 'ammo',
            ammoType: chosenWp.ammoType,
            name: `Büyük ${CONFIG.ammoTypes[chosenWp.ammoType].name}`,
            amount: ammoAmounts[chosenWp.ammoType] || 40,
            rarity: 'epic'
          }));
        } else {
          this.groundItems.push(new GroundItem(x - 15, this.getSmartAmmoDrop(wave, true)));
        }

        // 3. Destansı/Efsanevi Zırh veya Büyük Çanta
        const bossArmors = [
          { type: 'helmet', name: 'Taktik Balistik Kask', armorValue: 15, rarity: 'epic' },
          { type: 'armor', name: 'Ağır Çelik Yelek', armorValue: 30, rarity: 'epic' },
          { type: 'backpack', name: 'Büyük Çanta (+12 Slot)', extraSlots: 12, level: 3, rarity: 'legendary' }
        ];
        this.groundItems.push(new GroundItem(x + 15, { ...bossArmors[Math.floor(Math.random() * bossArmors.length)] }));

        // 4. Büyük Medkit (+100 Can)
        this.groundItems.push(new GroundItem(x + 45, { type: 'medkit', name: 'Büyük Medkit', healAmount: 100, rarity: 'epic', count: 1 }));
        return;
      }

      // 2. TANK DROPLARI (150 HP Mini-Boss - Garanti 2 Güçlü Drop)
      if (isTank) {
        // Drop 1: %70 İhtimalle Wave'e Uygun Güçlü Silah, %30 Ağır Zırh
        if (Math.random() < 0.70 || this.killsSinceLastWeaponDrop >= 8) {
          this.killsSinceLastWeaponDrop = 0;
          const wp = this.getRandomWeaponForWave(wave);
          this.groundItems.push(new GroundItem(x - 20, wp));
          // Eğer ateşli silahsa yanında mermisiyle gelsin
          if (wp.subType === 'gun') {
            const extraAmmo = this.getAmmoForWeapon(wp.ammoType, wave, true);
            this.groundItems.push(new GroundItem(x + 10, extraAmmo));
          }
        } else {
          this.groundItems.push(new GroundItem(x - 20, { type: 'armor', name: 'Ağır Çelik Yelek', armorValue: 25, rarity: 'epic' }));
        }

        // Drop 2: Büyük Mermi veya Medkit
        if (Math.random() < 0.65) {
          this.groundItems.push(new GroundItem(x + 35, this.getSmartAmmoDrop(wave, true)));
        } else {
          this.groundItems.push(new GroundItem(x + 35, { type: 'medkit', name: 'Orta Medkit', healAmount: 50, rarity: 'rare', count: 1 }));
        }
        return;
      }

      // 3. NORMAL VE ELİT DÜŞMANLAR (Zombi, Koşucu, Atıcı)
      // Kötü şans koruması: Eğer 10 düşmandır hiç silah düşmediyse bu düşmandan silah düşür!
      let forceWeapon = (this.killsSinceLastWeaponDrop >= 10);

      // Silah düşme olasılığı (Atıcıda %26, Koşucuda %18, Normal Zombide %14)
      const weaponChance = forceWeapon ? 1.0 : (isShooter ? 0.26 : (isRunner ? 0.18 : 0.14));
      // Mermi düşme olasılığı (Atıcıda %45, Koşucuda %40, Zombide %36)
      const ammoChance = isShooter ? 0.45 : (isRunner ? 0.40 : 0.36);
      // Medkit düşme olasılığı
      const medkitChance = 0.14;
      // Ekipman (Kask/Zırh/Kıyafet) olasılığı
      const equipChance = 0.14;
      // Çanta olasılığı
      const backpackChance = 0.04;

      const roll = Math.random();

      // 1. SİLAH DROPU (Wave'e göre kademeli)
      if (roll < weaponChance) {
        this.killsSinceLastWeaponDrop = 0;
        const weaponItem = this.getRandomWeaponForWave(wave);
        this.groundItems.push(new GroundItem(x, weaponItem));

        // Eğer ateşli silah düştüyse (M4A1, Pompalı, Roketatar, Tabanca), oyuncu anında kullanabilsin diye YANINA MERMİSİNİ DE BIRAK!
        if (weaponItem.subType === 'gun') {
          const companionAmmo = this.getAmmoForWeapon(weaponItem.ammoType, wave, false);
          this.groundItems.push(new GroundItem(x + 22, companionAmmo));
        }
        return;
      }

      // 2. MERMİ DROPU (Otomatik toplanan akıllı cephane)
      if (roll < weaponChance + ammoChance) {
        const ammoItem = this.getSmartAmmoDrop(wave, false);
        this.groundItems.push(new GroundItem(x, ammoItem));
        return;
      }

      // 3. MEDKİT DROPU (Yığınlanabilir)
      if (roll < weaponChance + ammoChance + medkitChance) {
        const mRand = Math.random();
        let med;
        if (wave >= 4 && mRand < 0.25) {
          med = { type: 'medkit', name: 'Büyük Medkit', healAmount: 100, rarity: 'epic', count: 1 };
        } else if ((wave >= 2 && mRand < 0.55) || mRand < 0.35) {
          med = { type: 'medkit', name: 'Orta Medkit', healAmount: 50, rarity: 'rare', count: 1 };
        } else {
          med = { type: 'medkit', name: 'Küçük Medkit', healAmount: 25, rarity: 'common', count: 1 };
        }
        this.groundItems.push(new GroundItem(x, med));
        return;
      }

      // 4. EKİPMAN (Kask, Zırh, Kıyafet)
      if (roll < weaponChance + ammoChance + medkitChance + equipChance) {
        const eqType = ['helmet', 'armor', 'outfit'][Math.floor(Math.random() * 3)];
        if (eqType === 'helmet') {
          const val = Math.min(15, 5 + Math.floor(Math.random() * 6) + Math.min(5, Math.floor(wave / 2)));
          const r = val >= 13 ? 'epic' : (val >= 9 ? 'rare' : (val >= 7 ? 'uncommon' : 'common'));
          const name = r === 'epic' ? 'Taktik Balistik Kask' : (r === 'rare' ? 'Kompozit Kask' : (r === 'uncommon' ? 'Askeri Kask' : 'Eski Kask'));
          this.groundItems.push(new GroundItem(x, { type: 'helmet', name, armorValue: val, rarity: r }));
        } else if (eqType === 'armor') {
          const val = Math.min(30, 10 + Math.floor(Math.random() * 11) + Math.min(10, wave * 2));
          const r = val >= 25 ? 'epic' : (val >= 18 ? 'rare' : (val >= 14 ? 'uncommon' : 'common'));
          const name = r === 'epic' ? 'Ağır Çelik Yelek' : (r === 'rare' ? 'Taktik Yelek' : (r === 'uncommon' ? 'Hafif Zırh' : 'Eski Yelek'));
          this.groundItems.push(new GroundItem(x, { type: 'armor', name, armorValue: val, rarity: r }));
        } else {
          const val = Math.min(10, 3 + Math.floor(Math.random() * 5) + Math.min(3, Math.floor(wave / 3)));
          const r = val >= 8 ? 'epic' : (val >= 6 ? 'rare' : (val >= 4 ? 'uncommon' : 'common'));
          const name = r === 'epic' ? 'Özel Harekat Kıyafeti' : (r === 'rare' ? 'Askeri Üniforma' : (r === 'uncommon' ? 'Kamuflaj Kıyafet' : 'Sivil Kıyafet'));
          this.groundItems.push(new GroundItem(x, { type: 'outfit', name, armorValue: val, rarity: r }));
        }
        return;
      }

      // 5. ÇANTA DROPU
      if (roll < weaponChance + ammoChance + medkitChance + equipChance + backpackChance) {
        let bp;
        if (wave >= 4 && Math.random() < 0.35) {
          bp = { type: 'backpack', name: 'Büyük Çanta (+12 Slot)', extraSlots: 12, level: 3, rarity: 'legendary' };
        } else if (wave >= 2 && Math.random() < 0.6) {
          bp = { type: 'backpack', name: 'Orta Çanta (+8 Slot)', extraSlots: 8, level: 2, rarity: 'rare' };
        } else {
          bp = { type: 'backpack', name: 'Küçük Çanta (+4 Slot)', extraSlots: 4, level: 1, rarity: 'uncommon' };
        }
        this.groundItems.push(new GroundItem(x, bp));
        return;
      }
    }

    spawnXp(x, y, amount) {
      this.xpOrbs.push(new XpOrb(x, y, amount));
    }

    onLevelUp() {
      sound.playLevelUp();
      this.particles.addLevelUpExplosion(this.player.x, this.player.y - this.player.height / 2);
      this.particles.addFloatingText('âš¡ SEVIYE ATLADINIZ! (LV. ' + this.player.level + ') âš¡', this.player.x, this.player.y - 70, '#facc15');
      if (this.state !== 'level_up' && this.state !== 'paused') {
        this.stateBeforePause = this.state;
      }

      this.state = 'level_up';
    }

    chooseSkill(skillKeyOrIndex) {
      const p = this.player;

      let card = null;
      if (typeof skillKeyOrIndex === 'number' && this.levelUpCards && this.levelUpCards[skillKeyOrIndex]) {
        card = this.levelUpCards[skillKeyOrIndex];
      } else if (typeof skillKeyOrIndex === 'string') {
        if (this.levelUpCards) {
          card = this.levelUpCards.find(c => c.id === skillKeyOrIndex);
        }
      }

      if (!card) {
        if (p.skills[skillKeyOrIndex] !== undefined) {
          card = { id: skillKeyOrIndex, isPerk: false, curLvl: p.skills[skillKeyOrIndex] };
        }
      }

      if (!card) return;

      if (card.isPerk) {
        sound.playLevelUp();
        this.particles.addLevelUpExplosion(p.x, p.y - p.height / 2);

        if (card.id === 'perk_heal') {
          p.maxHp += 15;
          p.hp = p.maxHp;
          this.particles.addFloatingText('+15 MAX CAN VE TAM SAGLIK!', p.x, p.y - 65, '#22c55e');
        } else if (card.id === 'perk_speed') {
          p.speedMultiplier = (p.speedMultiplier || 1.0) + 0.15;
          p.maxStamina += 25;
          p.stamina = p.maxStamina;
          this.particles.addFloatingText('+%15 HIZ VE +25 STAMINA!', p.x, p.y - 65, '#38bdf8');
        } else if (card.id === 'perk_damage') {
          p.damageMultiplier = (p.damageMultiplier || 1.0) + 0.15;
          this.particles.addFloatingText('+%15 TUM HASAR ARTISI!', p.x, p.y - 65, '#ef4444');
        } else if (card.id === 'perk_armor') {
          p.bonusArmor = (p.bonusArmor || 0) + 5;
          this.particles.addFloatingText('+5 KALICI DOGAL ZIRH!', p.x, p.y - 65, '#a855f7');
        } else if (card.id === 'perk_ammo') {
          p.ammo.pistol = Math.max(p.ammo.pistol, 150);
          p.ammo.rifle = Math.max(p.ammo.rifle, 300);
          p.ammo.shotgun = Math.max(p.ammo.shotgun, 80);
          p.ammo.rocket = Math.max(p.ammo.rocket, 20);
          for (let i = 0; i < 3; i++) {
            const wp = p.handSlots[i];
            if (wp && wp.subType === 'gun') wp.currentMag = wp.magSize;
          }
          this.score += 250;
          this.particles.addFloatingText('FULL CEPHANE & +250 SKOR!', p.x, p.y - 65, '#facc15');
        }

        this.resumeFromLevelUp();
        return;
      }

      // Standart Yetenek Secildi (superdash, big_ammo, power_shield)
      const skillKey = card.id;
      if (p.skills[skillKey] !== undefined) {
        if (p.skills[skillKey] < 3) {
          p.skills[skillKey]++;
          p.upgradeSkill(skillKey);
          sound.playLevelUp();
          this.particles.addLevelUpExplosion(p.x, p.y - p.height / 2);
          const titles = { superdash: 'SUPER DASH', big_ammo: 'BIG AMMO', power_shield: 'POWER SHIELD' };
          this.particles.addFloatingText((titles[skillKey] || skillKey) + ' YUKSELTILDI! (LV ' + p.skills[skillKey] + '/3)', p.x, p.y - 65, '#facc15');
          this.resumeFromLevelUp();
        } else {
          this.particles.addFloatingText('Bu yetenek maksimum! Reroll [R] veya Pas [ESC] yapabilirsiniz.', p.x, p.y - 45, '#ef4444');
          sound.playEmptyClick();
        }
      }
    }

    rerollLevelUpSkills() {
      sound.playPickup();
      const p = this.player;
      const allSkillsMaxed = (p.skills.superdash >= 3 && p.skills.big_ammo >= 3 && p.skills.power_shield >= 3);
      if (allSkillsMaxed) {
        this.generateLevelUpCards(true);
      } else {
        const nextMode = (this.levelUpMode === 'skills') ? true : false;
        this.generateLevelUpCards(nextMode);
      }
      this.particles.addFloatingText('SECENEKLER YENILENDI!', p.x, p.y - 45, '#38bdf8');
    }

    passLevelUp() {
      sound.playItemUse();
      const p = this.player;
      const healAmount = 35;
      p.hp = Math.min(p.maxHp, p.hp + healAmount);
      this.particles.addFloatingText('+' + healAmount + ' CAN (PAS GECILDI)', p.x, p.y - 50, '#22c55e');
      this.resumeFromLevelUp();
    }

    resumeFromLevelUp() {
      if (this.waveManager && !this.waveManager.isWaveActive) {
        this.state = 'between_waves';
      } else {
        this.state = (this.stateBeforePause === 'between_waves') ? 'between_waves' : 'playing';
      }
    }

    performMeleeAttack(px, py, angle, range, dmg, isLegendary) {
      let hitAny = false;
      for (const enemy of this.enemies) {
        if (enemy.isDead) continue;
        const dist = Math.hypot(enemy.x - px, (enemy.y - enemy.height / 2) - py);
        if (dist <= range + 15) {
          const enemyAngle = Math.atan2((enemy.y - enemy.height / 2) - py, enemy.x - px);
          let diff = Math.abs(angle - enemyAngle);
          while (diff > Math.PI) diff -= Math.PI * 2;
          diff = Math.abs(diff);

          if (diff <= 1.2) {
            enemy.takeDamage(dmg);
            hitAny = true;
          }
        }
      }
      if (hitAny) {
        this.camera.shake(isLegendary ? 7 : 3, 0.15);
      }
    }

    explodeRocket(x, y, directDmg, radius) {
      sound.playExplosion();
      this.camera.shake(14, 0.35);
      this.particles.addExplosion(x, y, radius);

      for (const enemy of this.enemies) {
        if (enemy.isDead) continue;
        const dist = Math.hypot(enemy.x - x, (enemy.y - enemy.height / 2) - y);
        if (dist <= radius) {
          const falloff = 1 - (dist / radius) * 0.5;
          enemy.takeDamage(directDmg * falloff);
        }
      }
    }

    update(dt) {
      this.ui.updateFPS(dt);

      if (this.state === 'playing' || this.state === 'between_waves') {
        this.survivalTime += dt;
        this.camera.update(this.player.x, dt);
        this.player.update(dt, this.input);
        this.particles.update(dt);

        // Mermilerin güncellenmesi ve çarpışma kontrolü
        for (let i = this.projectiles.length - 1; i >= 0; i--) {
          const p = this.projectiles[i];
          p.update(dt);

          if (!p.active) {
            this.projectiles.splice(i, 1);
            continue;
          }

          if (p.isPlayer) {
            // Oyuncu mermisi düşmana çarptı mı?
            for (const enemy of this.enemies) {
              if (enemy.isDead) continue;
              if (p.x >= enemy.x - enemy.width / 2 && p.x <= enemy.x + enemy.width / 2 &&
                  p.y >= enemy.y - enemy.height && p.y <= enemy.y) {
                p.active = false;
                if (p.isRocket) {
                  this.explodeRocket(p.x, p.y, p.damage, p.aoeRadius);
                } else {
                  enemy.takeDamage(p.damage);
                }
                break;
              }
            }
          } else {
            // Düşman mermisi oyuncuya çarptı mı?
            if (p.x >= this.player.x - this.player.width / 2 && p.x <= this.player.x + this.player.width / 2 &&
                p.y >= this.player.y - this.player.height && p.y <= this.player.y) {
              p.active = false;
              this.player.takeDamage(p.damage);
            }
          }
        }

        // Düşmanların güncellenmesi
        for (let i = this.enemies.length - 1; i >= 0; i--) {
          const enemy = this.enemies[i];
          enemy.update(dt, this.player);
          if (!enemy.active) {
            this.enemies.splice(i, 1);
          }
        }

        // Yerdeki eşyaların güncellenmesi & otomatik mermi çekimi/toplanması
        for (let i = this.groundItems.length - 1; i >= 0; i--) {
          const gi = this.groundItems[i];
          gi.update(dt);

          // Otomatik Mermi Toplama (Manyetik çekim & cephaneye doğrudan aktarım)
          if (gi.item && gi.item.type === 'ammo') {
            const playerCenterY = this.player.y - this.player.height / 2;
            const dx = this.player.x - gi.x;
            const dy = playerCenterY - gi.y;
            const dist = Math.hypot(dx, dy);

            // 170 px mesafe içinde manyetik çekim ile oyuncuya uçar
            if (dist < 170) {
              const pullSpeed = 460;
              gi.x += (dx / dist) * pullSpeed * dt;
              gi.y += (dy / dist) * pullSpeed * dt;

              // 40 px yakına gelince otomatik cephaneye ekle
              if (dist < 40) {
                const ammoType = gi.item.ammoType;
                const amount = gi.item.amount;
                this.player.ammo[ammoType] = (this.player.ammo[ammoType] || 0) + amount;
                this.particles.addFloatingText(`+${amount} ${gi.item.name}`, this.player.x, this.player.y - 45, '#22c55e');
                sound.playPickup();
                this.groundItems.splice(i, 1);
              }
            }
          }
        }

        // XP Kürelerinin güncellenmesi & manyetik çekim ve otomatik toplanması
        for (let i = this.xpOrbs.length - 1; i >= 0; i--) {
          const orb = this.xpOrbs[i];
          orb.update(dt);

          const playerCenterY = this.player.y - this.player.height / 2;
          const dx = this.player.x - orb.x;
          const dy = playerCenterY - orb.y;
          const dist = Math.hypot(dx, dy);

          // 200 px mesafe içinde manyetik çekim ile oyuncuya uçar
          if (dist < 200) {
            const pullSpeed = 520;
            orb.x += (dx / dist) * pullSpeed * dt;
            orb.y += (dy / dist) * pullSpeed * dt;

            // 38 px yakına gelince otomatik topla
            if (dist < 38) {
              this.player.addXp(orb.value);
              sound.playPickup();
              this.xpOrbs.splice(i, 1);
            }
          }
        }

        // Dalga Yöneticisi
        if (this.state === 'playing') {
          if (this.waveManager.isWaveActive) {
            this.waveManager.update(dt, this.enemies, this.player);
          } else {
            // Failsafe: Wave bittiği halde state 'playing' kalırsa otomatik between_waves'e geçir
            this.state = 'between_waves';
          }
        } else if (this.state === 'between_waves') {
          this.waveManager.prepTimer -= dt;
          if (this.waveManager.prepTimer <= 0) {
            this.waveManager.startWave(this.waveManager.currentWave + 1);
          }
        }
      }
    }

    render() {
      this.ctx.clearRect(0, 0, CONFIG.canvas.width, CONFIG.canvas.height);

      const cameraX = this.camera.getOffsetX();
      const cameraY = this.camera.getOffsetY();
      const zoom = this.camera.zoom || 1.0;

      this.ctx.save();
      const midX = CONFIG.canvas.width / 2;
      const midY = CONFIG.canvas.height / 2;
      this.ctx.translate(midX, midY + cameraY);
      this.ctx.scale(zoom, zoom);
      this.ctx.translate(-midX, -midY);

      // 1. Arka Plan Parallax
      this.parallax.render(this.ctx, cameraX, this.chapter);

      // 2. Yerdeki Eşyalar
      for (const gi of this.groundItems) {
        gi.render(this.ctx, cameraX);
      }

      // 2.5 XP Küreleri
      for (const orb of this.xpOrbs) {
        orb.render(this.ctx, cameraX);
      }

      // [E] Al bildirim yazısı (en yakın eşya için - mermiler hariç çünkü otomatik toplanır)
      if (this.state === 'playing' || this.state === 'between_waves') {
        for (const gi of this.groundItems) {
          if (gi.item && gi.item.type === 'ammo') continue;
          if (Math.abs(this.player.x - gi.x) <= CONFIG.player.pickupRange) {
            const sx = gi.x - cameraX;
            this.ctx.fillStyle = CONFIG.rarityColors[gi.item.rarity] || '#ffffff';
            this.ctx.font = 'bold 12px sans-serif';
            this.ctx.textAlign = 'center';
            const pickKey = (typeof settings !== 'undefined') ? settings.getKeyDisplayName(settings.keybinds.pickup[0]) : 'E';
            this.ctx.fillText(`[${pickKey}] Al: ${gi.item.name}`, sx, CONFIG.gameplay.groundY - 32);
            break;
          }
        }
      }

      // 3. Düşmanlar
      for (const enemy of this.enemies) {
        enemy.render(this.ctx, cameraX);
      }

      // 4. Oyuncu
      if (this.state === 'playing' || this.state === 'between_waves' || this.state === 'paused' || this.state === 'settings') {
        this.player.render(this.ctx, cameraX, this.input);
      }

      // 5. Mermiler
      for (const p of this.projectiles) {
        p.render(this.ctx, cameraX);
      }

      // 6. Partiküller ve Kayan Yazılar
      this.particles.render(this.ctx, cameraX);

      this.ctx.restore();

      // 7. UI ve Ekranlar (Kamera ofsetinden bağımsız sabit ekran koordinatları)
      this.ui.render(this.ctx);
    }

    initLoop() {
      const loop = (currentTime) => {
        let dt = (currentTime - this.lastTime) / 1000;
        this.lastTime = currentTime;

        // dt üst sınır 0.05 sn
        if (dt > CONFIG.gameplay.maxDt) dt = CONFIG.gameplay.maxDt;

        this.update(dt);
        this.render();

        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    }
  }

  // Oyunu Başlat
  window.addEventListener('DOMContentLoaded', () => {
    window.game = new Game();
  });
  </script>
</body>
</html>
