      if (isJumpKey && this.isGrounded && this.stamina >= CONFIG.player.jumpCost) {
        this.vy = CONFIG.player.jumpImpulse;
        this.isGrounded = false;
        this.stamina -= CONFIG.player.jumpCost;
        this.staminaRegenDelayTimer = CONFIG.player.staminaRegenDelay;
      }

      // 3. Yerçekimi ve Fizik
      this.vy += CONFIG.player.gravity * dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;

      // Zemin çarpışması
      if (this.y >= CONFIG.gameplay.groundY) {
        this.y = CONFIG.gameplay.groundY;
        this.vy = 0;
        this.isGrounded = true;
      }

      // Dünya sınırları (20..5980)
      this.x = Math.max(20, Math.min(CONFIG.gameplay.worldWidth - 20, this.x));

      // 4. Stamina Yenilenmesi (1.5 sn bekleme ardından saniyede 25)
      if (this.staminaRegenDelayTimer > 0) {
        this.staminaRegenDelayTimer -= dt;
      } else if (this.stamina < this.maxStamina) {
        this.stamina = Math.min(this.maxStamina, this.stamina + CONFIG.player.staminaRegenRate * dt);
      }

      // 5. Medkit İlerlemesi
      if (this.isHealing) {
        this.healTimer -= dt;
        if (this.healTimer <= 0) {
          this.isHealing = false;
          if (this.healingItem) {
            this.hp = Math.min(this.maxHp, this.hp + this.healingItem.healAmount);
            this.healingItem.count = (this.healingItem.count || 1) - 1;
            if (this.healingItem.count <= 0) {
              if (this.healingSlot && window.game.inventory.getItemFromSlot(this.healingSlot) === this.healingItem) {
                window.game.inventory.setItemToSlot(this.healingSlot, null);
              } else {
                for (let i = 0; i < window.game.inventory.grid.length; i++) {
                  if (window.game.inventory.grid[i] === this.healingItem) {
                    window.game.inventory.grid[i] = null;
                    break;
                  }
                }
              }
            }
            sound.playHeal();
            window.game.particles.addFloatingText(`+${this.healingItem.healAmount} Can`, this.x, this.y - 45, '#22c55e');
          }
        }
      }

      // 6. Reload Mantığı
      if (this.isReloading) {
        this.reloadTimer -= dt;
        if (this.reloadTimer <= 0) {
          const weapon = this.getActiveWeapon();
          if (weapon && weapon.subType === 'gun') {
            const reserve = this.ammo[weapon.ammoType] || 0;
            if (weapon.reloadTimePerShell) {
              // Pompalı için mermi başına doldurma
              if (weapon.currentMag < weapon.magSize && reserve > 0) {
                weapon.currentMag += 1;
                this.ammo[weapon.ammoType] -= 1;
                sound.playReload();
                if (weapon.currentMag < weapon.magSize && this.ammo[weapon.ammoType] > 0) {
                  this.reloadTimer = weapon.reloadTimePerShell;
                } else {
                  this.isReloading = false;
                }
              } else {
                this.isReloading = false;
              }
            } else {
              // Standart şarjör doldurma
              const needed = weapon.magSize - weapon.currentMag;
              const fill = Math.min(needed, reserve);
              weapon.currentMag += fill;
              this.ammo[weapon.ammoType] -= fill;
              this.isReloading = false;
              sound.playReload();
            }
          } else {
            this.isReloading = false;
          }
        }
      }

      // 7. Ateş / Saldırı Mantığı
      if (this.fireTimer > 0) this.fireTimer -= dt;
      if (this.slashTimer > 0) {
        this.slashTimer -= dt;
        if (this.slashTimer <= 0) this.isSlashing = false;
      }

      if (!input.isMouseDown) {
        this.hasFiredThisClick = false;
      }

      if (input.isMouseDown && input.mouseY < CONFIG.ui.bottomPanelY && !this.isReloading) {
        this.tryAttack(input);
      }
    }

    tryAttack(input) {
      const weapon = this.getActiveWeapon();
      if (!weapon || this.fireTimer > 0) return;
      if (!weapon.auto && this.hasFiredThisClick) return;
      this.hasFiredThisClick = true;

      const mousePos = window.game.camera.screenToWorld(input.mouseX, input.mouseY);
      const mouseWorldX = mousePos.x;
      const mouseWorldY = mousePos.y;
      const aimAngle = Math.atan2(mouseWorldY - (this.y - 28), mouseWorldX - this.x);

      if (weapon.subType === 'melee') {
        // Yakın Dövüş Kılıç Saldırısı
        this.fireTimer = weapon.cooldown;
        this.isSlashing = true;
        this.slashTimer = 0.18;
        this.slashAngle = aimAngle;
        this.slashRange = weapon.range;
        this.slashIsLegendary = (weapon.id === 'legendary_sword');

        sound.playSlash(this.slashIsLegendary);
        window.game.performMeleeAttack(this.x, this.y - 28, aimAngle, weapon.range, weapon.damage, this.slashIsLegendary);
      } else if (weapon.subType === 'gun') {
        // Ateşli Silah Saldırısı
        if (weapon.currentMag <= 0) {
          this.reload();
          return;
        }

        this.fireTimer = weapon.fireRate;
        weapon.currentMag -= 1;
        sound.playShoot(weapon.id === 'rocket_launcher' ? 'rocket' : (weapon.id === 'shotgun' ? 'shotgun' : (weapon.id === 'm4a1' ? 'rifle' : 'pistol')));

        const spawnX = this.x + Math.cos(aimAngle) * 22;
        const spawnY = (this.y - 28) + Math.sin(aimAngle) * 22;

        if (weapon.id === 'shotgun') {
          // Pompalı: 8 saçma yelpaze şeklinde
          for (let i = 0; i < weapon.pellets; i++) {
            const spreadAngle = aimAngle + (Math.random() - 0.5) * weapon.spread;
            window.game.projectiles.push(new Projectile({
              x: spawnX,
              y: spawnY,
              vx: Math.cos(spreadAngle) * weapon.speed,
              vy: Math.sin(spreadAngle) * weapon.speed,
              damage: weapon.damage,
              speed: weapon.speed,
              isPlayer: true,
              maxRange: weapon.maxRange,
              color: '#facc15'
            }));
          }
        } else if (weapon.id === 'rocket_launcher') {
          // Roket Atar: AoE patlama
          window.game.projectiles.push(new Projectile({
            x: spawnX,
            y: spawnY,
            vx: Math.cos(aimAngle) * weapon.speed,
            vy: Math.sin(aimAngle) * weapon.speed,
            damage: weapon.damage,
            speed: weapon.speed,
            isPlayer: true,
            isRocket: true,
            aoeRadius: weapon.aoeRadius,
            color: '#f87171'
          }));
        } else {
          // Tabanca veya M4A1
          const spreadAngle = aimAngle + (weapon.spread ? (Math.random() - 0.5) * weapon.spread : 0);
          window.game.projectiles.push(new Projectile({
            x: spawnX,
            y: spawnY,
            vx: Math.cos(spreadAngle) * weapon.speed,
            vy: Math.sin(spreadAngle) * weapon.speed,
            damage: weapon.damage,
            speed: weapon.speed,
            isPlayer: true,
            color: weapon.id === 'm4a1' ? '#fb923c' : '#facc15'
          }));
        }

        // Ateş efekti partikülü & Namlu dumanı
        window.game.particles.addSparks(spawnX, spawnY, 4, '#facc15');
        window.game.particles.addMuzzleSmoke(spawnX, spawnY);

        // Pirinç kovan fırlatma (Roket hariç)
        if (weapon.id !== 'rocket_launcher') {
          const isAimingLeft = Math.abs(aimAngle) > Math.PI / 2;
          const casingAngle = aimAngle - (isAimingLeft ? -1.5 : 1.5) + (Math.random() - 0.5) * 0.5;
          const casingSpeed = 80 + Math.random() * 80;
          window.game.particles.addShellCasing(
            spawnX - Math.cos(aimAngle) * 12,
            spawnY - Math.sin(aimAngle) * 12,
            Math.cos(casingAngle) * casingSpeed,
            Math.sin(casingAngle) * casingSpeed - 120
          );
        }
      }
    }

    render(ctx, cameraX, input) {
      const sx = this.x - cameraX;
      if (sx < -60 || sx > CONFIG.canvas.width + 60) return;

      ctx.save();

      // Nişan açısı ve hedef
      const mousePos = window.game.camera.screenToWorld(input.mouseX, input.mouseY);
      const mouseWorldX = mousePos.x;
      const mouseWorldY = mousePos.y;
      const shoulderX = sx + (this.facingRight ? 2 : -2);
      const shoulderY = this.y - 34;
      const aimAngle = Math.atan2(mouseWorldY - shoulderY, mouseWorldX - this.x);

      // Yerde gerçekçi yumuşak gölge
      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.beginPath();
      ctx.ellipse(sx, CONFIG.gameplay.groundY - 1, 16, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Ekipman Renkleri
      const eq = window.game ? window.game.inventory.equipment : {};
      const helmetColor = eq.helmet ? CONFIG.rarityColors[eq.helmet.rarity] : '#334155';
      const armorColor = eq.armor ? CONFIG.rarityColors[eq.armor.rarity] : '#1e293b';
      const outfitColor = eq.outfit ? CONFIG.rarityColors[eq.outfit.rarity] : '#881337'; // Varsayılan bordo kazak kolu

      // 1. Sırt Çantası (Karakterin arkasında çizilir)
      if (eq.backpack) {
        ctx.fillStyle = CONFIG.rarityColors[eq.backpack.rarity] || '#854d0e';
        const bpX = this.facingRight ? (sx - 13) : (sx + 4);
        ctx.fillRect(bpX, this.y - 40, 9, 18);
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(bpX + 1, this.y - 42, 7, 3); // Uyku matı
      }

      // 2. Google Flow 10 Karelik Animasyonlu Karakter Sprite'ı
      let frame = 4; // Doğal bekleme (idle) karesi
      if (!this.isGrounded) {
        frame = this.vy < 0 ? 1 : 9; // Zıplama yükselme / düşüş karesi
      } else if (Math.abs(this.vx) > 5) {
        frame = Math.floor(this.walkAnimTime) % 10;
      }

      ctx.save();
      ctx.translate(sx, this.y);
      if (!this.facingRight) {
        ctx.scale(-1, 1);
      }
      ctx.imageSmoothingEnabled = false;

      if (PLAYER_SPRITE_IMG && PLAYER_SPRITE_IMG.complete) {
        // Sprite hücresi: 108 x 232 px, hedef render boyutu: 29 x 62 px
        ctx.drawImage(
          PLAYER_SPRITE_IMG,
          frame * 108, 0, 108, 232,
          -14.5, -60, 29, 62
        );
      }
      ctx.restore();

      // 3. Kuşanılan Zırh Yeleği (Varsa gövdede parlar)
      if (eq.armor) {
        ctx.save();
        ctx.fillStyle = armorColor;
        ctx.globalAlpha = 0.82;
        ctx.fillRect(sx - 7, this.y - 38, 14, 14);
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1;
        ctx.strokeRect(sx - 7, this.y - 38, 14, 14);
        ctx.fillStyle = '#334155';
        ctx.fillRect(sx - 5, this.y - 30, 3, 4);
        ctx.fillRect(sx + 2, this.y - 30, 3, 4);
        ctx.restore();
      }

      // 4. Kuşanılan Kask (Varsa kafa üzerinde parlar)
      if (eq.helmet) {
        ctx.save();
        ctx.fillStyle = helmetColor;
        ctx.beginPath();
        ctx.arc(sx, this.y - 50, 9, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(sx - 8, this.y - 51, 16, 3);
        ctx.fillStyle = '#0284c7';
        const eyeOffsetX = this.facingRight ? 1 : -3;
        ctx.fillRect(sx - 3 + eyeOffsetX, this.y - 50, 5, 2.5);
        ctx.restore();
      }

      // 5. Silah ve Kol (Mouse açısına döner)
      ctx.save();
      ctx.translate(shoulderX, shoulderY);
      ctx.rotate(aimAngle);

      // Sola dönerken silahın baş aşağı durmasını önlemek için Y eksenini çevir
      const isAimingLeft = Math.abs(aimAngle) > Math.PI / 2;
      if (isAimingLeft) {
        ctx.scale(1, -1);
      }

      const weapon = this.getActiveWeapon();
      if (weapon) {
        ctx.save();
        if (weapon.subType === 'melee') {
          // Kılıç el modeli
          Inventory.drawItemIcon(ctx, weapon, 22, -2, 38);
        } else {
          // Ateşli silah el modeli
          Inventory.drawItemIcon(ctx, weapon, 18, -1, 32);

          // İki elle tutuş (Tüfek, Pompalı, Roketatar için ön destek kolu)
          if (weapon.id !== 'pistol') {
            const frontHandX = (weapon.id === 'm4a1') ? 25 : 20;
            ctx.strokeStyle = outfitColor;
            ctx.lineWidth = 3.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-3, 6);
            ctx.lineTo(frontHandX, 2);
            ctx.stroke();

            ctx.strokeStyle = '#090d16'; // Eldiven
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(frontHandX - 2, 2);
            ctx.lineTo(frontHandX + 3, 2);
            ctx.stroke();
          }

          // AteÅŸ ederken Muzzle Flash (Alev patlamasÄ±)
          if (this.fireTimer > weapon.fireRate * 0.6) {
            ctx.save();
            const flashX = (weapon.id === 'm4a1') ? 42 : 34;
            ctx.translate(flashX, -1);
            ctx.fillStyle = '#fde047';
            ctx.shadowColor = '#f59e0b';
            ctx.shadowBlur = 14;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(14, -5);
            ctx.lineTo(9, -1);
            ctx.lineTo(18, 0);
            ctx.lineTo(9, 1);
            ctx.lineTo(14, 5);
            ctx.closePath();
            ctx.fill();

            // Namlu alevi ışık halesi
            const flashGrad = ctx.createRadialGradient(8, 0, 2, 8, 0, 75);
            flashGrad.addColorStop(0, 'rgba(253, 224, 71, 0.4)');
            flashGrad.addColorStop(0.5, 'rgba(245, 158, 11, 0.15)');
            flashGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = flashGrad;
            ctx.beginPath();
            ctx.arc(8, 0, 75, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }
        ctx.restore();
      }

      // Ana Taktik Kol & Eldiven (Kabzayı tutan el)
      ctx.strokeStyle = outfitColor;
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(13, 0);
      ctx.stroke();

      // Siyah parmaksız eldiven
      ctx.strokeStyle = '#090d16';
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.moveTo(11, 0);
      ctx.lineTo(14, 0);
      ctx.stroke();

      ctx.restore();

      // 6. Kılıç Savurma Yay Animasyonu (Slash arc)
      if (this.isSlashing) {
        ctx.save();
        ctx.translate(shoulderX, shoulderY);
        ctx.strokeStyle = this.slashIsLegendary ? '#fbbf24' : 'rgba(255, 255, 255, 0.85)';
        ctx.lineWidth = this.slashIsLegendary ? 7 : 4;
        ctx.shadowColor = this.slashIsLegendary ? '#f59e0b' : '#38bdf8';
        ctx.shadowBlur = this.slashIsLegendary ? 18 : 8;

        ctx.beginPath();
        ctx.arc(0, 0, this.slashRange * 0.85, this.slashAngle - 0.75, this.slashAngle + 0.75);
        ctx.stroke();
        ctx.restore();
      }

      // 7. Medkit veya Reload İlerleme Çubuğu
      if (this.isHealing) {
        const prog = 1 - (this.healTimer / 1.2);
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(sx - 25, this.y - 65, 50, 7);
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(sx - 25, this.y - 65, 50 * prog, 7);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        ctx.strokeRect(sx - 25, this.y - 65, 50, 7);
      } else if (this.isReloading) {
        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#000000';
        ctx.shadowBlur = 4;
        ctx.fillText('Reload...', sx, this.y - 58);
      }

      // 8. Superdash Hız Efekti (Ghost trail çizgileri)
      if (this.isDashing) {
        ctx.save();
        const dir = this.facingRight ? 1 : -1;
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.65;
        for (let i = 1; i <= 3; i++) {
          const trailX = sx - dir * (i * 18);
          ctx.beginPath();
          ctx.moveTo(trailX - dir * 14, this.y - 16);
          ctx.lineTo(trailX + dir * 12, this.y - 16);
          ctx.moveTo(trailX - dir * 10, this.y - 32);
          ctx.lineTo(trailX + dir * 15, this.y - 32);
          ctx.stroke();
        }
        ctx.restore();
      }

      // 9. Power Shield Koruma Kalkanı (Yuvarlak dönen enerji küresi & süre barı)
      if (this.shieldActiveTimer > 0) {
        ctx.save();
        const maxDur = [0, 3.0, 3.5, 4.0][Math.min(3, Math.max(1, this.skills.power_shield))] || 3.0;
        const prog = Math.max(0, this.shieldActiveTimer / maxDur);
        const cy = this.y - this.height / 2;

        // Dış koruma kalkanı çemberi
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.5;
        ctx.shadowColor = '#0284c7';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(sx, cy, 38, 0, Math.PI * 2);
        ctx.stroke();

        // Saydam enerji dolgusu
        ctx.fillStyle = 'rgba(56, 189, 248, 0.18)';
        ctx.fill();

        // Dönen hekzagonal enerji noktaları
        const rot = Date.now() * 0.005;
        for (let k = 0; k < 6; k++) {
          const a = rot + k * (Math.PI / 3);
          const px = sx + Math.cos(a) * 38;
          const py = cy + Math.sin(a) * 38;
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(px - 2.5, py - 2.5, 5, 5);
        }

        // Kalkan süre çubuğu
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(sx - 24, this.y - 76, 48, 6);
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(sx - 24, this.y - 76, 48 * prog, 6);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        ctx.strokeRect(sx - 24, this.y - 76, 48, 6);
        ctx.restore();
      }

      ctx.restore();
    }
  }

  // ==========================================
  // 10. ENEMIES
  // ==========================================
  class Enemy {
    constructor(type, x, wave) {
      this.type = type;
      this.x = x;
      this.y = CONFIG.gameplay.groundY;
      this.vx = 0;
      this.vy = 0;
      this.active = true;
      this.isDead = false;
      this.deathTimer = 0.5;

      const cfg = CONFIG.enemies[type];
      this.name = cfg.name;
      this.width = cfg.width;
      this.height = cfg.height;
      this.color = cfg.color;
      this.damage = cfg.damage;
      this.shootCooldown = cfg.shootCooldown || 2.0;
      this.shootTimer = Math.random() * 1.5;

      // Zorluk çarpanları
      const hpMult = 1 + 0.12 * (wave - 1);
      const speedMult = Math.min(1.5, 1 + 0.03 * (wave - 1));

      this.hp = (type === 'boss' ? cfg.baseHp * (window.game ? window.game.chapter : 1) : cfg.hp) * hpMult;
      this.maxHp = this.hp;
      this.speed = cfg.speed * speedMult;
      this.score = cfg.score * (type === 'boss' ? (window.game ? window.game.chapter : 1) : 1);

      this.attackCooldownTimer = 0;
      this.walkAnimTime = Math.random() * 10;
    }

    takeDamage(dmg) {
      if (this.isDead) return;
      this.hp -= dmg;
      sound.playHit();
      window.game.particles.addBlood(this.x, this.y - this.height / 2, 5);
      window.game.particles.addFloatingText(`${Math.round(dmg)}`, this.x, this.y - this.height - 10, '#ffffff');

      if (this.hp <= 0) {
        this.hp = 0;
        this.die();
      }
    }

    die() {
      if (this.isDead) return;
      this.isDead = true;
      window.game.score += this.score;
      window.game.kills += 1;

      // Drop düşürme (Düşman tipine göre özel drop tablosu)
      window.game.spawnDrop(this.x, this.type);

      // XP Küreleri Düşürme (Canavara göre değer)
      const xpValues = { zombie: 12, runner: 18, shooter: 24, tank: 42, boss: 180 };
      const xpAmount = xpValues[this.type] || 15;
      window.game.spawnXp(this.x, this.y - this.height / 2, xpAmount);
    }

    update(dt, player) {
      if (this.isDead) {
        this.deathTimer -= dt;
        if (this.deathTimer <= 0) {
          this.active = false;
        }
        return;
      }

      const dx = player.x - this.x;
      const dist = Math.abs(dx);
      const dir = dx > 0 ? 1 : -1;

      if (this.attackCooldownTimer > 0) {
        this.attackCooldownTimer -= dt;
      }

      // Atıcı (Shooter) tipi uzaktan mermi sıkar
      if (this.type === 'shooter') {
        if (dist > CONFIG.enemies.shooter.shootRange) {
          this.x += dir * this.speed * dt;
          this.walkAnimTime += dt * 10;
        } else {
          // Ateş menzilinde
          this.shootTimer -= dt;
          if (this.shootTimer <= 0) {
            this.shootTimer = CONFIG.enemies.shooter.shootCooldown;
            // Oyuncuya doğru mermi ateşle
            const bulletSpeed = CONFIG.enemies.shooter.bulletSpeed;
            const angle = Math.atan2((player.y - 25) - (this.y - 25), player.x - this.x);
            window.game.projectiles.push(new Projectile({
              x: this.x,
              y: this.y - 25,
              vx: Math.cos(angle) * bulletSpeed,
              vy: Math.sin(angle) * bulletSpeed,
              damage: this.damage,
              speed: bulletSpeed,
              isPlayer: false,
              color: '#c084fc'
            }));
            sound.playShoot('pistol');
          }
        }
      } else {
        // Zombi, Koşucu, Tank, Boss doğrudan oyuncunun yatay konumuna ilerler
        const touchDistX = (this.width + player.width) * 0.45;
        if (dist > touchDistX) {
          this.x += dir * this.speed * dt;
          this.walkAnimTime += dt * (this.type === 'runner' ? 18 : 8);
        }

        // HASAR KONTROLÜ: SADECE fiziksel olarak temas ettiğimizde hasar verilir!
        // Oyuncu üstünden zıplarken ayakları düşmanın kafasından yukarıdaysa hasar ALMAZ!
        const playerBottom = player.y;
        const playerTop = player.y - player.height;
        const enemyBottom = this.y;
        const enemyTop = this.y - this.height;

        const isCollidingX = dist <= (this.width + player.width) * 0.48;
        // Düşmanın kafasının en az 8px içine girmiş olmalı (üstünden atlarken hasar yemez!)
        const isCollidingY = (playerBottom >= enemyTop + 8) && (playerTop <= enemyBottom);

        if (isCollidingX && isCollidingY) {
          if (this.attackCooldownTimer <= 0) {
            this.attackCooldownTimer = 1.0;
            player.takeDamage(this.damage);
          }
        }
      }
    }

    render(ctx, cameraX) {
      const sx = this.x - cameraX;
      if (sx < -120 || sx > CONFIG.canvas.width + 120) return;

      ctx.save();

      // Ölüm animasyonu (yere devrilme ve kan birikintisi)
      if (this.isDead) {
        const alpha = Math.max(0, this.deathTimer / 0.5);
        ctx.globalAlpha = alpha;
        ctx.translate(sx, this.y);
        ctx.rotate(Math.PI / 2);
        ctx.fillStyle = '#450a0a';
        ctx.fillRect(-this.height / 2, -this.width / 2, this.height, this.width);
        ctx.restore();
        return;
      }

      const dir = (window.game && window.game.player.x >= this.x) ? 1 : -1;

      // Yerde gerçekçi yumuşak gölge
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath();
      ctx.ellipse(sx, CONFIG.gameplay.groundY - 1, this.width * 0.7, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      const legSwing = Math.sin(this.walkAnimTime) * 10;

      if (this.type === 'zombie') {
        // --- 1. ZOMBİ (Çürümüş yeşil deri, yırtık elbiseler, uzanan pençeler) ---
        // Yırtık pantolonlu bacaklar
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(sx - 4, this.y - 18);
        ctx.lineTo(sx - 5 - legSwing * 0.8, this.y);
        ctx.stroke();

        ctx.strokeStyle = '#4d7c0f'; // Açıkta kalan çürük bacak
        ctx.beginPath();
        ctx.moveTo(sx + 4, this.y - 18);
        ctx.lineTo(sx + 5 + legSwing * 0.8, this.y);
        ctx.stroke();

        // Gövde & Yırtık gömlek
        ctx.fillStyle = '#166534';
        ctx.fillRect(sx - 8, this.y - 34, 16, 17);
        // Kan lekeleri
        ctx.fillStyle = '#7f1d1d';
        ctx.fillRect(sx - 3, this.y - 28, 6, 6);

        // Kafa
        ctx.fillStyle = '#4d7c0f';
        ctx.beginPath();
        ctx.arc(sx, this.y - 40, 8, 0, Math.PI * 2);
        ctx.fill();

        // Kanlı ağız & çene
        ctx.fillStyle = '#450a0a';
        ctx.fillRect(sx - (dir > 0 ? 0 : 5), this.y - 37, 5, 3.5);

        // Parlayan sarı/kırmızı gözler
        ctx.fillStyle = '#facc15';
        ctx.fillRect(sx - 3 + (dir * 2), this.y - 43, 2.5, 2.5);

        // Oyuncuya uzanan pençeli kollar
        ctx.strokeStyle = '#4d7c0f';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(sx + (dir * 3), this.y - 28);
        ctx.lineTo(sx + (dir * 16), this.y - 28 + Math.sin(this.walkAnimTime) * 3);
        ctx.stroke();

        ctx.fillStyle = '#0f172a'; // Tırnaklar
        ctx.fillRect(sx + (dir * 16) - 1, this.y - 29 + Math.sin(this.walkAnimTime) * 3, 3, 2);

      } else if (this.type === 'runner') {
        // --- 2. KOŞUCU (Öne eğik, hızlı kırmızı enfekte avcı) ---
        ctx.save();
        ctx.translate(sx, this.y - 20);
        ctx.rotate(dir * 0.28); // Agresif öne hücum açısı

        // Hızlı bacaklar
        ctx.strokeStyle = '#7f1d1d';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(-4, 2);
        ctx.lineTo(-7 - legSwing * 1.2, 20);
        ctx.moveTo(4, 2);
        ctx.lineTo(6 + legSwing * 1.2, 20);
        ctx.stroke();

        // Çevik gövde
        ctx.fillStyle = '#b91c1c';
        ctx.fillRect(-7, -14, 14, 16);

        // Sırttaki parlayan kırmızı omurga dikenleri
        ctx.fillStyle = '#f87171';
        for (let sp = -12; sp <= 0; sp += 4) {
          ctx.beginPath();
          ctx.moveTo(-dir * 7, sp);
          ctx.lineTo(-dir * 12, sp - 2);
          ctx.lineTo(-dir * 7, sp + 2);
          ctx.fill();
        }

        // Baş & Vahşi çene
        ctx.fillStyle = '#991b1b';
        ctx.beginPath();
        ctx.arc(dir * 3, -20, 7.5, 0, Math.PI * 2);
        ctx.fill();

        // Kırmızı parlayan vahşi gözler
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 8;
        ctx.fillRect(dir * 5, -22, 3, 3);
        ctx.shadowBlur = 0;

        // Pençeli pençeler
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(dir * 2, -8);
        ctx.lineTo(dir * 18, -4);
        ctx.stroke();

        ctx.restore();

      } else if (this.type === 'tank') {
        // --- 3. TANK (Ağır zırhlı mutant devi, çelik omuzluklar) ---
        // Kalın bacaklar
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 7;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(sx - 8, this.y - 24);
        ctx.lineTo(sx - 10 - legSwing * 0.6, this.y);
        ctx.moveTo(sx + 8, this.y - 24);
        ctx.lineTo(sx + 10 + legSwing * 0.6, this.y);
        ctx.stroke();

        // Ağır Gövde & Sarı-Siyah Tehlike Şeritli Göğüs Zırhı
        ctx.fillStyle = '#374151';
        ctx.fillRect(sx - 17, this.y - 50, 34, 28);
        ctx.strokeStyle = '#111827';
        ctx.lineWidth = 2;
        ctx.strokeRect(sx - 17, this.y - 50, 34, 28);

        // Tehlike çizgileri
        ctx.fillStyle = '#eab308';
        ctx.fillRect(sx - 12, this.y - 38, 24, 5);

        // Perçinli ağır çelik omuzluklar
        ctx.fillStyle = '#64748b';
        ctx.fillRect(sx - 21, this.y - 52, 9, 14);
        ctx.fillRect(sx + 12, this.y - 52, 9, 14);
        // Omuzluk dikenleri
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(sx - 18, this.y - 56, 3, 4);
        ctx.fillRect(sx + 15, this.y - 56, 3, 4);

        // Miğfer & Kırmızı dar vizör yarığı
        ctx.fillStyle = '#1f2937';
        ctx.beginPath();
        ctx.arc(sx, this.y - 54, 11, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ef4444';
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 10;
        ctx.fillRect(sx - 6 + (dir * 3), this.y - 56, 9, 3);
        ctx.shadowBlur = 0;

        // Dikenli demir yumruklar
        ctx.fillStyle = '#475569';
        ctx.beginPath();
        ctx.arc(sx + (dir * 14), this.y - 30, 7, 0, Math.PI * 2);
        ctx.fill();

      } else if (this.type === 'shooter') {
        // --- 4. ATICI (Pelerinli haydut nişancı, gaz maskesi ve tüfek) ---
        // Bacaklar
        ctx.strokeStyle = '#1e1b4b';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(sx - 4, this.y - 18);
        ctx.lineTo(sx - 5 - legSwing * 0.7, this.y);
        ctx.moveTo(sx + 4, this.y - 18);
        ctx.lineTo(sx + 5 + legSwing * 0.7, this.y);
        ctx.stroke();

        // Yırtık mor pelerin
        ctx.fillStyle = '#4338ca';
        ctx.beginPath();
        ctx.moveTo(sx - 8, this.y - 34);
        ctx.lineTo(sx + 8, this.y - 34);
        ctx.lineTo(sx + 10 - (dir * 6), this.y - 12);
        ctx.lineTo(sx - 10 - (dir * 6), this.y - 12);
        ctx.closePath();
        ctx.fill();

        // Kukuleta & Gaz Maskesi
        ctx.fillStyle = '#312e81';
        ctx.beginPath();
        ctx.arc(sx, this.y - 40, 8, 0, Math.PI * 2);
        ctx.fill();

        // Parlayan mor lensler
        ctx.fillStyle = '#c084fc';
        ctx.shadowColor = '#a855f7';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(sx + (dir * 3), this.y - 41, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Keskin Nişancı Tüfeği (Oyuncuya doğrultulmuş)
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(sx + (dir * 2), this.y - 30, dir * 26, 4.5);
        ctx.fillStyle = '#38bdf8'; // Optik
        ctx.fillRect(sx + (dir * 8), this.y - 34, dir * 8, 3);

        // Lazer nişangah çizgisi
        ctx.strokeStyle = 'rgba(168, 85, 247, 0.4)';
        ctx.lineWidth = 1;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(sx + (dir * 28), this.y - 28);
        ctx.lineTo(window.game ? window.game.player.x - cameraX : sx + (dir * 400), this.y - 28);
        ctx.stroke();
        ctx.setLineDash([]);

      } else {
        // --- 5. BOSS (Bölüm Bossu devasa mutant yaratık) ---
        const pulse = 0.6 + Math.sin(Date.now() * 0.007) * 0.4;

        // Devasa sütun bacaklar
        ctx.strokeStyle = '#450a0a';
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(sx - 12, this.y - 32);
        ctx.lineTo(sx - 14 - legSwing * 0.6, this.y);
        ctx.moveTo(sx + 12, this.y - 32);
        ctx.lineTo(sx + 14 + legSwing * 0.6, this.y);
        ctx.stroke();

        // Kaslı devasa gövde
        ctx.fillStyle = '#7f1d1d';
        ctx.fillRect(sx - 22, this.y - 65, 44, 38);

        // Göğüste atan kızıl biyo-çekirdek
        ctx.fillStyle = '#ef4444';
        ctx.shadowColor = '#dc2626';
        ctx.shadowBlur = 18 * pulse;
        ctx.beginPath();
        ctx.arc(sx, this.y - 50, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Sırttaki kavisli kemik tırpanlar
        ctx.strokeStyle = '#fef08a';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(sx - 16, this.y - 60);
        ctx.quadraticCurveTo(sx - 35, this.y - 85, sx - 20, this.y - 95);
        ctx.moveTo(sx + 16, this.y - 60);
        ctx.quadraticCurveTo(sx + 35, this.y - 85, sx + 20, this.y - 95);
        ctx.stroke();

        // Korkunç kafa & Boynuz tacı
        ctx.fillStyle = '#450a0a';
        ctx.beginPath();
        ctx.arc(sx, this.y - 72, 14, 0, Math.PI * 2);
        ctx.fill();

        // Boynuzlar
        ctx.fillStyle = '#eab308';
        ctx.beginPath();
        ctx.moveTo(sx - 10, this.y - 78);
        ctx.lineTo(sx - 16, this.y - 92);
        ctx.lineTo(sx - 6, this.y - 82);
        ctx.moveTo(sx + 10, this.y - 78);
        ctx.lineTo(sx + 16, this.y - 92);
        ctx.lineTo(sx + 6, this.y - 82);
        ctx.fill();

        // Yanan alevli gözler
        ctx.fillStyle = '#fde047';
        ctx.shadowColor = '#f59e0b';
        ctx.shadowBlur = 10;
        ctx.fillRect(sx - 7 + (dir * 3), this.y - 75, 4, 4);
        ctx.shadowBlur = 0;

        // Devasa kemik pala / tırpan
        ctx.save();
        ctx.translate(sx + (dir * 22), this.y - 42);
        ctx.rotate(dir * 0.3 + Math.sin(this.walkAnimTime) * 0.2);
        ctx.fillStyle = '#cbd5e1';
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(dir * 36, -18);
        ctx.lineTo(dir * 28, 14);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      // Can Barı (Küçük düşmanlar üstte, Boss ekran tepesinde)
      if (this.type !== 'boss' && this.hp < this.maxHp) {
        const barW = Math.max(34, this.width * 1.3);
        const barH = 5;
        const prog = this.hp / this.maxHp;
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(sx - barW / 2, this.y - this.height - 14, barW, barH);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(sx - barW / 2, this.y - this.height - 14, barW * prog, barH);
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1;
        ctx.strokeRect(sx - barW / 2, this.y - this.height - 14, barW, barH);
      }

      ctx.restore();
    }
  }

  // ==========================================
  // 11. WAVE MANAGER
  // ==========================================
  class WaveManager {
    constructor() {
      this.currentWave = 1;
      this.prepTimer = 0;
      this.isWaveActive = false;
      this.totalToSpawn = 0;
      this.spawnedCount = 0;
      this.spawnTimer = 0;
    }

    startWave(waveNum) {
      this.currentWave = waveNum;
      this.isWaveActive = true;
      this.spawnedCount = 0;
      this.totalToSpawn = 5 + waveNum * 3;
      this.spawnTimer = 0.5;

      sound.playWaveStart();
      if (window.game) {
        window.game.state = 'playing';
        window.game.particles.addFloatingText(`DALGA ${waveNum} BAŞLADI!`, window.game.player.x, 220, '#facc15', 26);
      }
    }

    update(dt, enemiesList, player) {
      if (!this.isWaveActive) return;

      // Düşman spawn döngüsü
      if (this.spawnedCount < this.totalToSpawn && enemiesList.length < CONFIG.wave.maxActiveEnemies) {
        this.spawnTimer -= dt;
        if (this.spawnTimer <= 0) {
          this.spawnTimer = 0.8 + Math.random() * 0.8;
          this.spawnEnemy(player);
        }
      }

      // Dalga bitti mi? (Hepsi spawn oldu ve tüm düşmanlar öldü)
      if (this.spawnedCount >= this.totalToSpawn && enemiesList.length === 0) {
        this.onWaveCompleted();
      }
    }

    spawnEnemy(player) {
      const cameraX = window.game.camera.getOffsetX();
      // Kamera dışından sağdan veya soldan spawn
      const spawnSide = Math.random() > 0.5 ? 1 : -1;
      let spawnX = spawnSide === 1 ? (cameraX + CONFIG.canvas.width + 60) : (cameraX - 60);
      spawnX = Math.max(30, Math.min(CONFIG.gameplay.worldWidth - 30, spawnX));

      // Düşman tipini dalga numarasına göre seç
      let type = 'zombie';
      const available = ['zombie'];
      if (this.currentWave >= 3) available.push('runner');
      if (this.currentWave >= 4) available.push('shooter');
      if (this.currentWave >= 5) available.push('tank');

      type = available[Math.floor(Math.random() * available.length)];

      window.game.enemies.push(new Enemy(type, spawnX, this.currentWave));
      this.spawnedCount++;
    }

    onWaveCompleted() {
      this.isWaveActive = false;
      const game = window.game;

      // Hikaye modunda 5 wave + Boss
      if (game.mode === 'story') {
        if (this.currentWave === 5) {
          // Boss Dalgası
          this.startBossWave();
          return;
        } else if (this.currentWave > 5) {
          // Boss öldü, Chapter bitti
          game.completeChapter();
          return;
        }
      }

      // Normal wave bitimi: 8 sn hazırlık süresi
      game.state = 'between_waves';
      this.prepTimer = CONFIG.wave.prepDuration;
      game.particles.addFloatingText('DALGA TEMİZLENDİ!', game.player.x, 220, '#22c55e', 24);
    }

    startBossWave() {
      this.currentWave = 6; // Boss wave
      this.isWaveActive = true;
      this.spawnedCount = 1;
      this.totalToSpawn = 1;

      sound.playWaveStart();
      const cameraX = window.game.camera.getOffsetX();
      const spawnX = Math.min(CONFIG.gameplay.worldWidth - 100, cameraX + CONFIG.canvas.width + 80);

      window.game.enemies.push(new Enemy('boss', spawnX, this.currentWave));
      if (window.game && window.game.state !== 'level_up' && window.game.state !== 'paused') {
        window.game.state = 'playing';
      }
      window.game.particles.addFloatingText('DİKKAT! BÖLÜM BOSSU GELDİ!', window.game.player.x, 200, '#ef4444', 30);
    }
  }

  // ==========================================
  // 12. UI (PANELS, STATS, TOOLTIPS, MENUS)
  // ==========================================
  class UIManager {
    constructor(game) {
      this.game = game;
      this.fps = 60;
      this.fpsTimer = 0;
      this.frameCount = 0;
      this.showFPS = true;
      this.settingsTab = 'display'; // 'display', 'audio', 'controls'
      this.rebindingAction = null;
    }

    updateFPS(dt) {
      this.frameCount++;
      this.fpsTimer += dt;
      if (this.fpsTimer >= 0.5) {
        this.fps = Math.round((this.frameCount / this.fpsTimer));
        this.frameCount = 0;
        this.fpsTimer = 0;
      }
    }

    render(ctx) {
      const g = this.game;

      // Dinamik imlec: sadece oynanis sirasinda nisan crosshair, diger tum menulerde normal ok/pointer
      const isCombat = (g.state === 'playing' || g.state === 'between_waves');
      if (g.canvas) {
        g.canvas.style.cursor = isCombat ? 'crosshair' : 'default';
      }

      if (g.state === 'playing' || g.state === 'between_waves' || g.state === 'paused' || g.state === 'level_up' || g.state === 'settings') {
        this.renderGameplayHeader(ctx);
        this.renderBottomPanel(ctx);
      }

      // Durum ekranları
      if (g.state === 'menu') this.renderMainMenu(ctx);
      else if (g.state === 'story_intro') this.renderStoryIntro(ctx);
      else if (g.state === 'paused') this.renderPauseOverlay(ctx);
      else if (g.state === 'chapter_end') this.renderChapterEnd(ctx);
      else if (g.state === 'game_over') this.renderGameOver(ctx);
      else if (g.state === 'level_up') this.renderLevelUpOverlay(ctx);
      else if (g.state === 'settings') this.renderSettings(ctx);

      // Tooltip ve Sürüklenen eşya hayaleti
      if (g.state === 'playing' || g.state === 'between_waves') {
        this.renderTooltip(ctx);
        this.renderDraggedItem(ctx);
      }
    }

    renderGameplayHeader(ctx) {
      const g = this.game;

      // Sol üstte Wave: X (Bölüm bilgisiyle birlikte)
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'left';
      ctx.shadowColor = '#000000';
      ctx.shadowBlur = 6;
      const waveLabel = g.waveManager.currentWave > 5 ? 'BOSS' : g.waveManager.currentWave;
      const chapterLabel = g.mode === 'story' ? ` (Bölüm ${g.chapter}/3)` : '';
      ctx.fillText(`Wave: ${waveLabel}${chapterLabel}`, 25, 34);

      // XP & Level Göstergesi (Wave'in hemen altında)
      const p = g.player;
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`LV. ${p.level}`, 25, 58);

      const xpBarW = 180;
      const xpBarH = 8;
      const xpProg = Math.min(1, Math.max(0, p.xp / p.xpNeeded));
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.fillRect(75, 50, xpBarW, xpBarH);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(75, 50, xpBarW * xpProg, xpBarH);
      ctx.strokeStyle = '#0284c7';
      ctx.lineWidth = 1;
      ctx.strokeRect(75, 50, xpBarW, xpBarH);
      ctx.fillStyle = '#cbd5e1';
      ctx.font = 'bold 8.5px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`${p.xp}/${p.xpNeeded} XP`, 75 + xpBarW / 2, 57);

      // Sağ üstte FPS: N
      if (this.showFPS) {
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 18px monospace';
        ctx.textAlign = 'right';
        ctx.fillText(`FPS: ${this.fps}`, CONFIG.canvas.width - 25, 34);
      }

      // Infinite modda üst ortada Süre: dk:sn
      if (g.mode === 'infinite') {
        const mins = Math.floor(g.survivalTime / 60);
        const secs = Math.floor(g.survivalTime % 60);
        const timeStr = `Süre: ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        ctx.fillStyle = '#fde047';
        ctx.font = 'bold 22px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(timeStr, CONFIG.canvas.width / 2, 36);
      }

      // Dalga Hazırlık Geri Sayımı ("Hazırlan... X sn")
      if (g.state === 'between_waves') {
        ctx.fillStyle = '#f59e0b';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        const leftSec = Math.ceil(g.waveManager.prepTimer);
        ctx.fillText(`Hazırlan... ${leftSec} sn`, CONFIG.canvas.width / 2, 90);
      }

      // Boss Can Barı (Varsa ekranın en üstünde)
      const boss = g.enemies.find(e => e.type === 'boss' && !e.isDead);
      if (boss) {
        const barW = 500;
        const barH = 16;
        const bx = CONFIG.canvas.width / 2 - barW / 2;
        const by = 55;
        const prog = boss.hp / boss.maxHp;

        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(bx, by, barW, barH);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(bx, by, barW * prog, barH);
        ctx.strokeStyle = '#f87171';
        ctx.lineWidth = 2;
        ctx.strokeRect(bx, by, barW, barH);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`BÖLÜM BOSSU: ${Math.round(boss.hp)} / ${Math.round(boss.maxHp)}`, CONFIG.canvas.width / 2, by + 12);
      }

      ctx.shadowBlur = 0;

      // Gameplay Ekranında Yetenekler HUD'u (Hand slotların hemen üstü, y = 422)
      this.renderSkillsHUD(ctx);
    }

    renderSkillsHUD(ctx) {
      const p = this.game.player;
      const hx = CONFIG.ui.handSlots.x;
      const hy = 424; // gameplay alanının alt kenarı

      // 1. [Q] Super Dash Slotu (x: hx - 92)
      const isDashReady = p.skills.superdash > 0 && p.dashCooldownTimer <= 0;
      ctx.fillStyle = isDashReady ? '#1e293b' : '#0f172a';
      ctx.fillRect(hx - 92, hy, 42, 40);
      ctx.strokeStyle = isDashReady ? '#38bdf8' : '#334155';
      ctx.lineWidth = isDashReady ? 2 : 1;
      ctx.strokeRect(hx - 92, hy, 42, 40);

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'left';
      const dashKey = (typeof settings !== 'undefined') ? settings.getKeyDisplayName(settings.keybinds.dash[0]) : 'Q';
      ctx.fillText(`[${dashKey}]`, hx - 88, hy + 12);

      if (p.skills.superdash === 0) {
        ctx.fillStyle = '#64748b';
        ctx.font = 'bold 8.5px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('KİLİT', hx - 71, hy + 26);
      } else if (p.dashCooldownTimer > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(hx - 92, hy, 42, 40);
        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 11px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`${p.dashCooldownTimer.toFixed(1)}s`, hx - 71, hy + 26);
      } else {
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('DASH', hx - 71, hy + 25);
        ctx.fillStyle = '#4ade80';
        ctx.font = 'bold 8px monospace';
        ctx.fillText('HAZIR', hx - 71, hy + 35);
      }

      // 2. [F] Power Shield Slotu (x: hx - 46)
      const isShieldReady = p.skills.power_shield > 0 && p.shieldCooldownTimer <= 0;
      const isShieldActive = p.shieldActiveTimer > 0;
      ctx.fillStyle = isShieldActive ? '#312e81' : (isShieldReady ? '#1e293b' : '#0f172a');
      ctx.fillRect(hx - 46, hy, 42, 40);
      ctx.strokeStyle = isShieldActive ? '#a855f7' : (isShieldReady ? '#818cf8' : '#334155');
      ctx.lineWidth = (isShieldActive || isShieldReady) ? 2 : 1;
      ctx.strokeRect(hx - 46, hy, 42, 40);

      ctx.fillStyle = '#818cf8';
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'left';
      const shieldKey = (typeof settings !== 'undefined') ? settings.getKeyDisplayName(settings.keybinds.shield[0]) : 'F';
      ctx.fillText(`[${shieldKey}]`, hx - 42, hy + 12);

      if (p.skills.power_shield === 0) {
        ctx.fillStyle = '#64748b';
        ctx.font = 'bold 8.5px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('KİLİT', hx - 25, hy + 26);
      } else if (isShieldActive) {
        ctx.fillStyle = '#c084fc';
        ctx.font = 'bold 11px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`${p.shieldActiveTimer.toFixed(1)}s`, hx - 25, hy + 26);
        ctx.fillStyle = '#4ade80';
        ctx.font = 'bold 7.5px sans-serif';
        ctx.fillText('AKTİF', hx - 25, hy + 35);
      } else if (p.shieldCooldownTimer > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(hx - 46, hy, 42, 40);
        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`${p.shieldCooldownTimer.toFixed(0)}s`, hx - 25, hy + 26);
      } else {
        ctx.fillStyle = '#818cf8';
        ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('KALKAN', hx - 25, hy + 25);
        ctx.fillStyle = '#4ade80';
        ctx.font = 'bold 8px monospace';
        ctx.fillText('HAZIR', hx - 25, hy + 35);
      }

      // 3. Big Ammo Pasif Rozeti (x: hx)
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(hx, hy + 18, 80, 22);
      ctx.strokeStyle = p.skills.big_ammo > 0 ? '#facc15' : '#334155';
      ctx.lineWidth = 1;
      ctx.strokeRect(hx, hy + 18, 80, 22);

      ctx.fillStyle = p.skills.big_ammo > 0 ? '#facc15' : '#64748b';
      ctx.font = 'bold 9.5px sans-serif';
      ctx.textAlign = 'center';
      const ammoTxt = p.skills.big_ammo > 0 ? `+${p.skills.big_ammo * 3} ŞARJÖR` : 'BIG AMMO (KİLİT)';
      ctx.fillText(ammoTxt, hx + 40, hy + 33);
    }

    renderBottomPanel(ctx) {
      const py = CONFIG.ui.bottomPanelY;
      const ph = CONFIG.canvas.height - py;

      // Panel Arka Planı
      ctx.fillStyle = '#0b0f17';
      ctx.fillRect(0, py, CONFIG.canvas.width, ph);

      // Üst Bölücü Çizgi
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, py);
      ctx.lineTo(CONFIG.canvas.width, py);
      ctx.stroke();

      // 4 Parça Ayracı Dikey Çizgiler
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1.5;
      [450, 710, 815].forEach(x => {
        ctx.beginPath();
        ctx.moveTo(x, py + 10);
        ctx.lineTo(x, CONFIG.canvas.height - 10);
        ctx.stroke();
      });

      // 1. Envanter Grid (x=20..440)
      this.renderInventoryGrid(ctx);

      // 2. Karakter Ekipmanı (x=460..700)
      this.renderCharacterInventory(ctx);

      // 3. Hand Slotlar (x=720..800)
      this.renderHandSlots(ctx);

      // 4. İstatistikler (x=830..1260)
      this.renderStatistics(ctx);
    }

    renderInventoryGrid(ctx) {
      const g = CONFIG.ui.invGrid;
      const inv = this.game.inventory;
      const inp = this.game.input;
      const maxSlots = inv.getMaxUnlockedSlots();

      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('ENVANTER', g.x, 488);

      for (let r = 0; r < g.rows; r++) {
        for (let c = 0; c < g.cols; c++) {
          const index = r * g.cols + c;
          const sx = g.x + c * (g.slotSize + g.gapX);
          const sy = g.y + r * (g.slotSize + g.gapY);
          const isUnlocked = index < maxSlots;
          const isHovered = (inp.mouseX >= sx && inp.mouseX <= sx + g.slotSize && inp.mouseY >= sy && inp.mouseY <= sy + g.slotSize);

          // Slot Arka Planı
          ctx.fillStyle = isUnlocked ? (isHovered ? '#1e293b' : '#161e2e') : '#0a0d14';
          ctx.fillRect(sx, sy, g.slotSize, g.slotSize);

          // Çerçeve (Hover durumunda neon mavi parlama)
          if (isHovered && isUnlocked) {
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#0284c7';
            ctx.shadowBlur = 8;
            ctx.strokeRect(sx, sy, g.slotSize, g.slotSize);
            ctx.shadowBlur = 0;
          } else {
            ctx.strokeStyle = isUnlocked ? '#334155' : '#1e293b';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(sx, sy, g.slotSize, g.slotSize);
          }

          if (!isUnlocked) {
            // Kilitli slot çizgileri ve simgesi
            ctx.strokeStyle = 'rgba(239, 68, 68, 0.25)';
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(sx + g.slotSize, sy + g.slotSize);
            ctx.stroke();
            ctx.fillStyle = '#64748b';
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('KİLİTLİ', sx + g.slotSize / 2, sy + g.slotSize / 2 + 3);
            continue;
          }

          const item = inv.grid[index];
          if (item) {
            // Eşya Nadirlik Çerçevesi
            const rColor = CONFIG.rarityColors[item.rarity] || '#ffffff';
            ctx.strokeStyle = rColor;
            ctx.lineWidth = 2;
            ctx.strokeRect(sx + 2, sy + 2, g.slotSize - 4, g.slotSize - 4);

            // Eşya İkonu
            Inventory.drawItemIcon(ctx, item, sx + g.slotSize / 2, sy + g.slotSize / 2, 28);

            // Stack Sayısı Rozeti (xN)
            if (item.count && item.count > 1) {
              ctx.save();
              ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
              ctx.fillRect(sx + g.slotSize - 25, sy + g.slotSize - 17, 23, 15);
              ctx.strokeStyle = rColor;
              ctx.lineWidth = 1;
              ctx.strokeRect(sx + g.slotSize - 25, sy + g.slotSize - 17, 23, 15);
              ctx.fillStyle = '#f8fafc';
              ctx.font = 'bold 11px monospace';
              ctx.textAlign = 'center';
              ctx.fillText(`x${item.count}`, sx + g.slotSize - 14, sy + g.slotSize - 5);
              ctx.restore();
            }
          }
        }
      }
    }

    renderCharacterInventory(ctx) {
      const inp = this.game.input;
      const player = this.game.player;
      const armor = player.getTotalArmor();

      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('EKİPMAN', 465, 488);
      ctx.fillStyle = '#38bdf8';
      ctx.font = '10px sans-serif';
      ctx.fillText('(Sağ Tık: Oto-Kuşan)', 545, 488);

      const cx = 580;
      const cy = 590;

      // Holografik Taktik Zemin & Bağlantı Yolları
      ctx.save();
      // Yuvadan Karakter Gövdesine Holografik Devre Hatları
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.28)';
      ctx.lineWidth = 1.2;
      ctx.setLineDash([3, 3]);

      // Kask hattı (580, 548 -> 580, 555)
      ctx.beginPath();
      ctx.moveTo(580, 548);
      ctx.lineTo(cx, cy - 35);
      ctx.stroke();

      // Zırh hattı (534, 591 -> 566, 591)
      ctx.beginPath();
      ctx.moveTo(534, 591);
      ctx.lineTo(cx - 14, cy - 14);
      ctx.stroke();

      // Çanta hattı (626, 591 -> 594, 591)
      ctx.beginPath();
      ctx.moveTo(626, 591);
      ctx.lineTo(cx + 14, cy - 14);
      ctx.stroke();

      // Kıyafet hattı (580, 634 -> 580, 620)
      ctx.beginPath();
      ctx.moveTo(580, 634);
      ctx.lineTo(cx, cy + 24);
      ctx.stroke();

      ctx.setLineDash([]); // Düz çizgiye dön

      // Ortada Karakter Askeri Dış İskelet Silüeti
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
      ctx.lineWidth = 1.8;

      // Kafa & Balistik Miğfer
      ctx.beginPath();
      ctx.arc(cx, cy - 35, 12, 0, Math.PI * 2);
      ctx.stroke();
      // Holografik Vizör (Mavi Işık)
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(cx - 8, cy - 37, 16, 3.5);

      // Göğüs & Omuz Zırh Plakaları
      ctx.beginPath();
      ctx.moveTo(cx - 24, cy - 16);
      ctx.lineTo(cx + 24, cy - 16);
      ctx.lineTo(cx + 14, cy + 14);
      ctx.lineTo(cx - 14, cy + 14);
      ctx.closePath();
      ctx.stroke();

      // Göğüs Çekirdek Reaktörü (Pulsing Diamond)
      const corePulse = 0.5 + Math.sin(Date.now() * 0.005) * 0.4;
      ctx.fillStyle = `rgba(56, 189, 248, ${corePulse})`;
      ctx.beginPath();
      ctx.moveTo(cx, cy - 10);
      ctx.lineTo(cx + 5, cy - 5);
      ctx.lineTo(cx, cy);
      ctx.lineTo(cx - 5, cy - 5);
      ctx.closePath();
      ctx.fill();

      // Omuzluklar
      ctx.strokeRect(cx - 27, cy - 18, 6, 8);
      ctx.strokeRect(cx + 21, cy - 18, 6, 8);

      // Bacaklar & Eklemler
      ctx.beginPath();
      ctx.moveTo(cx - 8, cy + 14);
      ctx.lineTo(cx - 14, cy + 42);
      ctx.moveTo(cx + 8, cy + 14);
      ctx.lineTo(cx + 14, cy + 42);
      ctx.stroke();

      // Diz Eklemi Çemberleri
      ctx.fillStyle = '#0284c7';
      ctx.beginPath();
      ctx.arc(cx - 11, cy + 28, 2.5, 0, Math.PI * 2);
      ctx.arc(cx + 11, cy + 28, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Canlı Savunma Değeri Göstergesi (Silüetin hemen altında)
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`DEFANS: %${armor}`, cx, cy + 56);

      // Mini Segmentli Zırh Barı (10 segment)
      const segW = 5;
      const segH = 4;
      const totalSegs = 10;
      const activeSegs = Math.round((armor / CONFIG.player.maxArmor) * totalSegs);
      for (let s = 0; s < totalSegs; s++) {
        ctx.fillStyle = s < activeSegs ? '#38bdf8' : '#1e293b';
        ctx.fillRect(cx - 30 + s * 6, cy + 61, segW, segH);
      }

      ctx.restore();

      // 4 Ekipman Slotu
      const eqSlots = [
        { key: 'helmet', label: 'KASK', x: 553, y: 494, size: 54 },
        { key: 'armor', label: 'ZIRH', x: 480, y: 564, size: 54 },
        { key: 'backpack', label: 'ÇANTA', x: 626, y: 564, size: 54 },
        { key: 'outfit', label: 'KIYAFET', x: 553, y: 634, size: 54 }
      ];

      const inv = this.game.inventory;
      for (const eq of eqSlots) {
        const isHovered = (inp.mouseX >= eq.x && inp.mouseX <= eq.x + eq.size && inp.mouseY >= eq.y && inp.mouseY <= eq.y + eq.size);

        ctx.fillStyle = isHovered ? '#1e293b' : '#161e2e';
        ctx.fillRect(eq.x, eq.y, eq.size, eq.size);

        if (isHovered) {
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2;
          ctx.shadowColor = '#0284c7';
          ctx.shadowBlur = 8;
          ctx.strokeRect(eq.x, eq.y, eq.size, eq.size);
          ctx.shadowBlur = 0;
        } else {
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(eq.x, eq.y, eq.size, eq.size);
        }

        // Taktik Köşe Destekleri (Cyber corner brackets)
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1;
        const bLen = 5;
        // Sol üst
        ctx.beginPath();
        ctx.moveTo(eq.x, eq.y + bLen); ctx.lineTo(eq.x, eq.y); ctx.lineTo(eq.x + bLen, eq.y);
        // Sağ üst
        ctx.moveTo(eq.x + eq.size - bLen, eq.y); ctx.lineTo(eq.x + eq.size, eq.y); ctx.lineTo(eq.x + eq.size, eq.y + bLen);
        // Sol alt
        ctx.moveTo(eq.x, eq.y + eq.size - bLen); ctx.lineTo(eq.x, eq.y + eq.size); ctx.lineTo(eq.x + bLen, eq.y + eq.size);
        // Sağ alt
        ctx.moveTo(eq.x + eq.size - bLen, eq.y + eq.size); ctx.lineTo(eq.x + eq.size, eq.y + eq.size); ctx.lineTo(eq.x + eq.size, eq.y + eq.size - bLen);
        ctx.stroke();

        const item = inv.equipment[eq.key];
        if (item) {
          const rColor = CONFIG.rarityColors[item.rarity] || '#ffffff';
          ctx.strokeStyle = rColor;
          ctx.lineWidth = 2;
          ctx.strokeRect(eq.x + 2, eq.y + 2, eq.size - 4, eq.size - 4);
          Inventory.drawItemIcon(ctx, item, eq.x + eq.size / 2, eq.y + eq.size / 2, 28);
        } else {
          // Boş yuvada şık hayalet ikon ve etiket
          ctx.save();
          ctx.globalAlpha = 0.25;
          Inventory.drawItemIcon(ctx, { type: eq.key, rarity: 'common' }, eq.x + eq.size / 2, eq.y + eq.size / 2 - 4, 26);
          ctx.restore();

          ctx.fillStyle = '#64748b';
          ctx.font = 'bold 9px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(eq.label, eq.x + eq.size / 2, eq.y + eq.size - 6);
        }
      }
    }

    renderHandSlots(ctx) {
      const hs = CONFIG.ui.handSlots;
      const player = this.game.player;
      const inp = this.game.input;

      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('EL (1-2-3)', hs.x, 488);

      for (let i = 0; i < 3; i++) {
        const sy = hs.y + i * (hs.height + hs.gapY);
        const isActive = (player.activeHandIndex === i);
        const isHovered = (inp.mouseX >= hs.x && inp.mouseX <= hs.x + hs.width && inp.mouseY >= sy && inp.mouseY <= sy + hs.height);

        ctx.fillStyle = isActive ? '#1e293b' : (isHovered ? '#161e2e' : '#111827');
        ctx.fillRect(hs.x, sy, hs.width, hs.height);

        // Aktif slota parlak altın sarısı veya mavi çerçeve
        if (isActive) {
          ctx.strokeStyle = '#facc15';
          ctx.lineWidth = 2.5;
          ctx.shadowColor = '#eab308';
          ctx.shadowBlur = 8;
          ctx.strokeRect(hs.x, sy, hs.width, hs.height);
          ctx.shadowBlur = 0;
        } else if (isHovered) {
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2;
          ctx.strokeRect(hs.x, sy, hs.width, hs.height);
        } else {
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(hs.x, sy, hs.width, hs.height);
        }

        // Rakam etiketi
        ctx.fillStyle = isActive ? '#facc15' : '#64748b';
        ctx.font = 'bold 11px monospace';
        ctx.textAlign = 'left';
        const slotKey = (typeof settings !== 'undefined') ? settings.getKeyDisplayName(settings.keybinds['slot' + (i + 1)][0]) : (i + 1);
        ctx.fillText(`[${slotKey}]`, hs.x + 5, sy + 14);

        const weapon = player.handSlots[i];
        if (weapon) {
          // İkon
          Inventory.drawItemIcon(ctx, weapon, hs.x + 28, sy + 38, 22);

          // Şarjör / Cephane Bilgisi
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 11px sans-serif';
          ctx.textAlign = 'right';
          if (weapon.subType === 'gun') {
            const reserve = player.ammo[weapon.ammoType] || 0;
            ctx.fillText(`${weapon.currentMag}/${reserve}`, hs.x + hs.width - 6, sy + 56);
          } else {
            ctx.fillText('∞', hs.x + hs.width - 8, sy + 56);
          }
        } else {
          ctx.save();
          ctx.globalAlpha = 0.2;
          Inventory.drawItemIcon(ctx, { type: 'weapon', subType: 'gun', id: 'pistol', rarity: 'common' }, hs.x + 28, sy + 38, 20);
          ctx.restore();
          ctx.fillStyle = '#475569';
          ctx.font = 'bold 10px sans-serif';
          ctx.textAlign = 'right';
          ctx.fillText('BOŞ', hs.x + hs.width - 8, sy + 56);
        }
      }
    }

    renderStatistics(ctx) {
      const p = this.game.player;
      const g = this.game;

      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('İSTATİSTİKLER', 835, 488);

      // Sol Sütun (Can, Stamina, Zırh, Aktif Silah, Mermi)
      const col1X = 835;
      let curY = 506;

      // 1. Can Barı (Kırmızı degrade + parlak cam efekti)
      ctx.fillStyle = '#cbd5e1';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText(`Can: ${Math.round(p.hp)} / ${p.maxHp}`, col1X, curY);
      curY += 6;
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(col1X, curY, 190, 11);

      const hpGrad = ctx.createLinearGradient(col1X, curY, col1X + 190, curY);
      hpGrad.addColorStop(0, '#dc2626');
      hpGrad.addColorStop(1, '#ef4444');
      ctx.fillStyle = hpGrad;
      ctx.fillRect(col1X, curY, 190 * (p.hp / p.maxHp), 11);
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 1;
      ctx.strokeRect(col1X, curY, 190, 11);

      // 2. Stamina Barı (Cyan degrade)
      curY += 19;
      ctx.fillStyle = '#cbd5e1';
      ctx.fillText(`Stamina: ${Math.round(p.stamina)} / ${p.maxStamina}`, col1X, curY);
      curY += 6;
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(col1X, curY, 190, 11);

      const stGrad = ctx.createLinearGradient(col1X, curY, col1X + 190, curY);
      stGrad.addColorStop(0, '#0284c7');
      stGrad.addColorStop(1, '#38bdf8');
      ctx.fillStyle = stGrad;
      ctx.fillRect(col1X, curY, 190 * (p.stamina / p.maxStamina), 11);
      ctx.strokeStyle = '#475569';
      ctx.strokeRect(col1X, curY, 190, 11);

      // 3. Zırh Değeri
      curY += 23;
      const armor = p.getTotalArmor();
      ctx.fillStyle = '#cbd5e1';
      ctx.fillText(`Zırh Değeri: %${armor} Azaltma (Maks 70)`, col1X, curY);

      // 4. Aktif Silah
      curY += 20;
      const activeWp = p.getActiveWeapon();
      const wpName = activeWp ? activeWp.name : 'Silahsız';
      ctx.fillText(`Aktif Silah: ${wpName}`, col1X, curY);

      // 5. Mermi
      curY += 20;
      if (activeWp && activeWp.subType === 'gun') {
        const reserve = p.ammo[activeWp.ammoType] || 0;
        ctx.fillText(`Mermi: ${activeWp.currentMag} / ${reserve} (${CONFIG.ammoTypes[activeWp.ammoType].name})`, col1X, curY);
      } else {
        ctx.fillText('Mermi: Sınırsız (Yakın Dövüş)', col1X, curY);
      }

      // Sağ Sütun (Öldürülen, Süre, Wave, Skor)
      const col2X = 1060;
      let rY = 512;

      ctx.fillText(`Öldürülen Düşman: ${g.kills}`, col2X, rY);
      rY += 22;

      const mins = Math.floor(g.survivalTime / 60);
      const secs = Math.floor(g.survivalTime % 60);
      ctx.fillText(`Hayatta Kalma: ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`, col2X, rY);
      rY += 22;

      ctx.fillText(`Mevcut Dalga: ${g.waveManager.currentWave}`, col2X, rY);
      rY += 22;

      ctx.fillStyle = '#facc15';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText(`Skor: ${g.score}`, col2X, rY);
    }

    renderTooltip(ctx) {
      const inp = this.game.input;
      if (inp.draggedItem || inp.mouseY < CONFIG.ui.bottomPanelY) return;

      const slot = this.game.inventory.getSlotAt(inp.mouseX, inp.mouseY);
      if (!slot) return;
      const item = this.game.inventory.getItemFromSlot(slot);

      // Boş ekipman yuvası hover bilgisi
      if (!item) {
        if (slot.type === 'equip') {
          const names = { helmet: 'Kask Yuvası', armor: 'Zırh Yuvası', backpack: 'Çanta Yuvası', outfit: 'Kıyafet Yuvası' };
          const tx = Math.min(CONFIG.canvas.width - 230, inp.mouseX + 15);
          const ty = Math.max(CONFIG.ui.bottomPanelY + 10, inp.mouseY - 70);
          ctx.save();
          ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
          ctx.fillRect(tx, ty, 220, 52);
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(tx, ty, 220, 52);
          ctx.fillStyle = '#38bdf8';
          ctx.font = 'bold 13px sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(names[slot.key] || 'Ekipman Yuvası', tx + 10, ty + 20);
          ctx.fillStyle = '#cbd5e1';
          ctx.font = '11px sans-serif';
          ctx.fillText('💡 [Sağ Tık] En iyiyi otomatik tak', tx + 10, ty + 38);
          ctx.restore();
        }
        return;
      }

      const tx = Math.min(CONFIG.canvas.width - 230, inp.mouseX + 15);
      const ty = Math.max(CONFIG.ui.bottomPanelY + 10, inp.mouseY - 86);

      ctx.save();
      ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
      ctx.fillRect(tx, ty, 220, 86);
      ctx.strokeStyle = CONFIG.rarityColors[item.rarity] || '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(tx, ty, 220, 86);

      ctx.fillStyle = CONFIG.rarityColors[item.rarity] || '#ffffff';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(item.name, tx + 10, ty + 20);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '11px sans-serif';
      if (item.type === 'weapon') {
        if (item.subType === 'melee') {
          ctx.fillText(`Hasar: ${item.damage} | Menzil: ${item.range}`, tx + 10, ty + 38);
          ctx.fillText(`Bekleme: ${item.cooldown} sn`, tx + 10, ty + 54);
        } else {
          ctx.fillText(`Hasar: ${item.damage} | Şarjör: ${item.magSize}`, tx + 10, ty + 38);
          ctx.fillText(`Atış Aralığı: ${item.fireRate} sn`, tx + 10, ty + 54);
        }
      } else if (item.type === 'medkit') {
        const countStr = ` | Adet: ${item.count || 1}/10`;
        ctx.fillText(`İyileştirme: +${item.healAmount} Can${countStr}`, tx + 10, ty + 38);
        ctx.fillText('Kullanım: 1.2 sn (Çift tık / Sağ tık)', tx + 10, ty + 54);
      } else if (['helmet', 'armor', 'outfit'].includes(item.type)) {
        ctx.fillText(`Zırh Değeri: +%${item.armorValue}`, tx + 10, ty + 38);
        ctx.fillText('💡 [Sağ Tık] En iyiyi otomatik tak', tx + 10, ty + 54);
      } else if (item.type === 'backpack') {
        ctx.fillText(`Kapasite: +${item.extraSlots} Slot`, tx + 10, ty + 38);
        ctx.fillText('💡 [Sağ Tık] En iyiyi otomatik tak', tx + 10, ty + 54);
      }

      ctx.fillStyle = '#64748b';
      ctx.font = '10px monospace';
      ctx.fillText('Sürükle-bırak ile taşı / Yere at', tx + 10, ty + 73);
      ctx.restore();
    }

    renderDraggedItem(ctx) {
      const inp = this.game.input;
      if (!inp.draggedItem) return;

      ctx.save();
      ctx.globalAlpha = 0.85;
      Inventory.drawItemIcon(ctx, inp.draggedItem, inp.mouseX, inp.mouseY, 32);
      ctx.restore();
    }

    renderSettings(ctx) {
      const g = this.game;
      this.settingsTab = this.settingsTab || 'display';

      // Arka plan karartmasi
      ctx.fillStyle = 'rgba(5, 7, 10, 0.88)';
      ctx.fillRect(0, 0, CONFIG.canvas.width, CONFIG.canvas.height);

      // Ana Panel Cercevesi
      const px = 180, py = 50, pw = 920, ph = 620;
      ctx.save();
      ctx.fillStyle = '#0f172a';
      ctx.strokeStyle = '#0284c7';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = '#0369a1';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(px, py, pw, ph, 12);
      else ctx.rect(px, py, pw, ph);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // Baslik
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 26px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('OYUN AYARLARI', px + 30, py + 42);

      // Kapat Butonu [X]
      this.drawButton(ctx, px + pw - 55, py + 16, 40, 36, 'X', '#334155', '#ef4444');

      // TAB BAR
      const tabY = py + 65, tabH = 42;
      const t1Active = this.settingsTab === 'display';
      const t2Active = this.settingsTab === 'audio';
      const t3Active = this.settingsTab === 'controls';

      this.drawButton(ctx, px + 30, tabY, 260, tabH, 'GORUNTU & FOV', t1Active ? '#0284c7' : '#1e293b', t1Active ? '#38bdf8' : '#475569');
      this.drawButton(ctx, px + 310, tabY, 260, tabH, 'SES AYARLARI', t2Active ? '#0284c7' : '#1e293b', t2Active ? '#38bdf8' : '#475569');
      this.drawButton(ctx, px + 590, tabY, 300, tabH, 'TUS ATAMALARI (KEYBINDS)', t3Active ? '#0284c7' : '#1e293b', t3Active ? '#38bdf8' : '#475569');

      // TAB 1: GORUNTU & FOV
      if (this.settingsTab === 'display') {
        const curZoom = (g.camera && g.camera.zoom) ? g.camera.zoom : 1.0;
        const zoomPct = Math.round(curZoom * 100);

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 18px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('Kamera Gorus Alani (FOV) & Karakter Yakinligi', px + 35, py + 155);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '13px sans-serif';
        ctx.fillText('Gameplay ekraninda karaktere olan odak yakinligini ayarlar. Yuksek deger yakin aksiyon, dusuk deger genis gorus saglar.', px + 35, py + 180);

        // Zoom Seviyesi Gostergesi & Stepper
        ctx.fillStyle = '#cbd5e1';
        ctx.font = 'bold 15px sans-serif';
        const zoomDesc = curZoom < 0.95 ? 'Genis FOV' : (curZoom > 1.15 ? 'Yakin Aksiyon' : 'Normal Standart');
        ctx.fillText('Mevcut Yakinlik: %' + zoomPct + ' (' + zoomDesc + ')', px + 35, py + 235);

        // Stepper: [- %5] [BAR %100] [+ %5]
        this.drawButton(ctx, px + 35, py + 255, 90, 42, '- %5', '#1e293b', '#64748b');

        // Gorsel Bar
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(px + 135, py + 255, 340, 42);
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(px + 135, py + 255, 340, 42);

        const barProgress = Math.max(0, Math.min(1, (curZoom - 0.75) / (1.5 - 0.75)));
        const grad = ctx.createLinearGradient(px + 135, 0, px + 135 + 340, 0);
        grad.addColorStop(0, '#0284c7');
        grad.addColorStop(1, '#38bdf8');
        ctx.fillStyle = grad;
        ctx.fillRect(px + 137, py + 257, (340 - 4) * barProgress, 38);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
