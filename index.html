<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kıyamet Hattı: 2D Wave Survival</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050608;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #111827 0%, #030712 100%);
    }
    canvas {
      display: block;
      width: min(100vw, calc(100vh * (16 / 9)));
      height: min(100vh, calc(100vw * (9 / 16)));
      aspect-ratio: 16 / 9;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.95), 0 0 25px rgba(239, 68, 68, 0.2);
      cursor: default;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
  </style>
</head>

  <div id="game-container">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
  </div>

      try {

      osc.type = 'square';
      osc.frequency.setValueAtTime(800, t);
      gain.gain.setValueAtTime(0.1, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
      osc.connect(gain);
      gain.connect(this.masterGain || this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.04);
    }

    playLevelUp() {
      if (!this.enabled || !this.ctx) return;
      const t = this.ctx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, t + idx * 0.08);
        gain.gain.setValueAtTime(0.2, t + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.08 + 0.35);
        osc.connect(gain);
        gain.connect(this.masterGain || this.ctx.destination);
        osc.start(t + idx * 0.08);
        osc.stop(t + idx * 0.08 + 0.35);
      });
    }

    playDash() {
      if (!this.enabled || !this.ctx) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(850, t);
      osc.frequency.exponentialRampToValueAtTime(140, t + 0.16);
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      osc.connect(gain);
      gain.connect(this.masterGain || this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.16);
    }

    playShield() {
      if (!this.enabled || !this.ctx) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(260, t);
      osc.frequency.linearRampToValueAtTime(520, t + 0.25);
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      osc.connect(gain);
      gain.connect(this.masterGain || this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.35);
    }

    playDeflect() {
      if (!this.enabled || !this.ctx) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1100, t);
      osc.frequency.exponentialRampToValueAtTime(220, t + 0.12);
      gain.gain.setValueAtTime(0.28, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      osc.connect(gain);
      gain.connect(this.masterGain || this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.12);
    }
  }

  const sound = new SoundManager();

  // ==========================================
  // 2.5 SETTINGS MANAGER (FOV / SES / TUÅ ATAMALARI)
  // ==========================================
  class SettingsManager {
    constructor() {
      // Varsayilan Tus Atamalari
      this.defaultKeybinds = {
        moveLeft: ['KeyA', 'ArrowLeft'],
        moveRight: ['KeyD', 'ArrowRight'],
        jump: ['Space', 'KeyW'],
        sprint: ['ShiftLeft', 'ShiftRight'],
        reload: ['KeyR'],
        pickup: ['KeyE'],
        dash: ['KeyQ'],
        shield: ['KeyF'],
        slot1: ['Digit1'],
        slot2: ['Digit2'],
        slot3: ['Digit3']
      };

      this.actionNames = {
        moveLeft: 'Sola Git',
        moveRight: 'Saga Git',
        jump: 'Zipla',
        sprint: 'Kos / Hizli',
        reload: 'Sarjor Degistir',
        pickup: 'Yerden Esya Al',
        dash: 'Super Dash Yetenegi',
        shield: 'Power Shield Yetenegi',
        slot1: '1. Silah Slotu',
        slot2: '2. Silah Slotu',
        slot3: '3. Silah Slotu'
      };

      this.keybinds = JSON.parse(JSON.stringify(this.defaultKeybinds));
      this.cameraZoom = 1.0;
      this.screenShake = 1.0;
      this.loadSettings();
    }

    loadSettings() {
      try {
        const savedZoom = localStorage.getItem('game_camera_zoom');
        if (savedZoom !== null) {
          const z = parseFloat(savedZoom);
          if (!isNaN(z) && z >= 0.75 && z <= 1.5) {
            this.cameraZoom = Math.round(z * 100) / 100;
          }
        }

        const savedBinds = localStorage.getItem('game_keybinds');
        if (savedBinds) {
          const parsed = JSON.parse(savedBinds);
          for (const k in this.defaultKeybinds) {
            if (parsed[k] && Array.isArray(parsed[k]) && parsed[k].length > 0) {
              this.keybinds[k] = parsed[k];
            }
          }
        }

        const savedShake = localStorage.getItem('game_screen_shake');
        if (savedShake !== null) {
          this.screenShake = parseFloat(savedShake) || 0;
        }

        const savedVol = localStorage.getItem('game_audio_volume');
        if (savedVol !== null && typeof sound !== 'undefined') {
          sound.setVolume(parseFloat(savedVol));
        }

        const savedSnd = localStorage.getItem('game_audio_enabled');
        if (savedSnd !== null && typeof sound !== 'undefined') {
          sound.setEnabled(savedSnd === '1');
        }
      } catch (e) {}
    }

    saveSettings() {
      try {
        localStorage.setItem('game_camera_zoom', this.cameraZoom.toString());
        localStorage.setItem('game_keybinds', JSON.stringify(this.keybinds));
        localStorage.setItem('game_screen_shake', this.screenShake.toString());
        if (typeof sound !== 'undefined') {
          localStorage.setItem('game_audio_volume', sound.volume.toString());
          localStorage.setItem('game_audio_enabled', sound.enabled ? '1' : '0');
        }
      } catch (e) {}
    }

    resetKeybinds() {
      this.keybinds = JSON.parse(JSON.stringify(this.defaultKeybinds));
      this.saveSettings();
    }

    setKeybind(action, newCode) {
      if (!this.keybinds[action]) return;
      this.keybinds[action] = [newCode];
      this.saveSettings();
    }

    setCameraZoom(z) {
      this.cameraZoom = Math.max(0.75, Math.min(1.5, Math.round(z * 100) / 100));
      if (window.game && window.game.camera) {
        window.game.camera.zoom = this.cameraZoom;
      }
      this.saveSettings();
    }

    cycleScreenShake() {
      if (this.screenShake >= 1.0) this.screenShake = 0.5;
      else if (this.screenShake >= 0.5) this.screenShake = 0.0;
      else this.screenShake = 1.0;
      this.saveSettings();
    }

    screenShakeLabel() {
      if (this.screenShake >= 1.0) return 'ACIK (%100)';
      if (this.screenShake >= 0.5) return 'DUSUK (%50)';
      return 'KAPALI (%0)';
    }

    isActionDown(action, keys) {
      const codes = this.keybinds[action];
      if (!codes) return false;
      for (let i = 0; i < codes.length; i++) {
        if (keys[codes[i]]) return true;
      }
      return false;
    }

    getActionFromKeyCode(code) {
      for (const action in this.keybinds) {
        if (this.keybinds[action].includes(code)) {
          return action;
        }
      }
      return null;
    }

    getKeyDisplayName(code) {
      if (!code) return '-';
      if (code.startsWith('Key')) return code.substring(3);
      if (code.startsWith('Digit')) return code.substring(5);
      if (code.startsWith('Numpad')) return 'Num ' + code.substring(6);
      if (code === 'Space') return 'Bosluk';
      if (code === 'ShiftLeft' || code === 'ShiftRight') return 'Shift';
      if (code === 'ControlLeft' || code === 'ControlRight') return 'Ctrl';
      if (code === 'AltLeft' || code === 'AltRight') return 'Alt';
      if (code === 'ArrowUp') return 'Yukari Ok';
      if (code === 'ArrowDown') return 'Asagi Ok';
      if (code === 'ArrowLeft') return 'Sol Ok';
      if (code === 'ArrowRight') return 'Sag Ok';
      if (code === 'Enter') return 'Enter';
      if (code === 'Tab') return 'Tab';
      if (code === 'Backspace') return 'Sil (Bksp)';
      return code;
    }
  }

  const settings = new SettingsManager();

  class InputManager {
    constructor(canvas) {
      this.canvas = canvas;
      this.keys = {};
      this.mouseX = 0;
      this.mouseY = 0;
      this.isMouseDown = false;
      this.isRightDown = false;
      this.lastClickTime = 0;
      this.lastClickSlot = null;

      // Drag and Drop State
      this.draggedItem = null;
      this.dragSource = null; // { type: 'inv'|'equip'|'hand', index: number|string }
      this.dragOffsetX = 0;
      this.dragOffsetY = 0;

      this.setupListeners();
    }

    isActionDown(action) {
      if (typeof settings !== 'undefined') {
        return settings.isActionDown(action, this.keys);
      }
      return false;
    }

    setupListeners() {
      window.addEventListener('keydown', (e) => {
        sound.init();

        // 1. Tuş Atama (Rebinding) Modu aktifse tuşu ata ve çık
        if (window.game && window.game.ui && window.game.ui.rebindingAction) {
          e.preventDefault();
          if (e.code !== 'Escape') {
            settings.setKeybind(window.game.ui.rebindingAction, e.code);
            sound.playPickup();
          }
          window.game.ui.rebindingAction = null;
          return;
        }

        this.keys[e.code] = true;
        if (!window.game) return;

        // Ayarlar menüsündeyken Escape ile kapatma
        if (window.game.state === 'settings') {
          if (e.code === 'Escape') {
            window.game.closeSettings();
            return;
          }
        }

        // Level Up ekranı yetenek tuşları (1, 2, 3)
        // Level Up ekrani tus kontrolleri: [1], [2], [3], [R] (Yenile), [P]/[Esc]/[Space] (Pas)
        if (window.game.state === 'level_up') {
          if (e.code === 'Digit1') window.game.chooseSkill(0);
          else if (e.code === 'Digit2') window.game.chooseSkill(1);
          else if (e.code === 'Digit3') window.game.chooseSkill(2);
          else if (e.code === 'KeyR') window.game.rerollLevelUpSkills();
          else if (e.code === 'KeyP' || e.code === 'Escape' || e.code === 'Space') window.game.passLevelUp();
          return;
        }

        // Hikaye giriş ekranında Space, Enter veya E ile dalga 1'e başlama
        if (window.game.state === 'story_intro') {
          if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyE' || settings.getActionFromKeyCode(e.code) === 'pickup' || settings.getActionFromKeyCode(e.code) === 'jump') {
            window.game.state = 'playing';
            window.game.camera.snapTo(window.game.player.x);
            window.game.waveManager.startWave(1);
            return;
          }
        }

        // Oyun İçi Tuş Kontrolleri
        if (window.game.state === 'playing' || window.game.state === 'between_waves') {
          const action = settings.getActionFromKeyCode(e.code);
          if (action === 'reload') window.game.player.reload();
          else if (action === 'pickup') window.game.tryPickupGroundItem();
          else if (action === 'dash') window.game.player.activateSuperDash();
          else if (action === 'shield') window.game.player.activatePowerShield();
          else if (action === 'slot1') window.game.player.setActiveHand(0);
          else if (action === 'slot2') window.game.player.setActiveHand(1);
          else if (action === 'slot3') window.game.player.setActiveHand(2);
          else if (e.code === 'Escape') window.game.togglePause();
        } else if (window.game.state === 'paused') {
          if (e.code === 'Escape') window.game.togglePause();
        }
      });

      window.addEventListener('keyup', (e) => {
        this.keys[e.code] = false;
      });

      this.updateMousePos = (e) => {
        const rect = this.canvas.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          const scaleX = this.canvas.width / rect.width;
          const scaleY = this.canvas.height / rect.height;
          this.mouseX = Math.max(0, Math.min(this.canvas.width, (e.clientX - rect.left) * scaleX));
          this.mouseY = Math.max(0, Math.min(this.canvas.height, (e.clientY - rect.top) * scaleY));
        }
      };

      this.canvas.addEventListener('mousemove', (e) => {
        this.updateMousePos(e);
      });

      this.canvas.addEventListener('mousedown', (e) => {
        this.updateMousePos(e);
        sound.init();
        if (e.button === 0) {
          this.isMouseDown = true;
          this.handleLeftMouseDown();
        } else if (e.button === 2) {
          this.isRightDown = true;
          this.handleRightClick();
        }
      });

      window.addEventListener('mouseup', (e) => {
        this.updateMousePos(e);
        if (e.button === 0) {
          this.isMouseDown = false;
          this.handleLeftMouseUp();
        } else if (e.button === 2) {
          this.isRightDown = false;
        }
      });

      this.canvas.addEventListener('contextmenu', (e) => {
        e.preventDefault();
      });
    }

    handleLeftMouseDown() {
      if (!window.game) return;
      const game = window.game;

      // Sadece menü/hikaye/durdurma durumlarındaki UI tıklamaları
      if (game.state !== 'playing' && game.state !== 'between_waves') {
        game.ui.handleScreenClick(this.mouseX, this.mouseY);
        return;
      }

      // Alt panel kontrolü (Envanter, Ekipman, Hand slotlar)
      if (this.mouseY >= CONFIG.ui.bottomPanelY) {
        const slotInfo = game.inventory.getSlotAt(this.mouseX, this.mouseY);
        if (slotInfo) {
          const now = Date.now();
          const isDoubleClick = (now - this.lastClickTime < 300) && (this.lastClickSlot === slotInfo.id);
          this.lastClickTime = now;
          this.lastClickSlot = slotInfo.id;

          if (isDoubleClick) {
            game.inventory.handleDoubleClick(slotInfo);
            return;
          }

          // Tek tıkla el seçimi (hand slot)
          if (slotInfo.type === 'hand') {
            game.player.setActiveHand(slotInfo.index);
          }

          // Sürüklemeyi başlat
          const item = game.inventory.getItemFromSlot(slotInfo);
          if (item) {
            this.draggedItem = item;
            this.dragSource = slotInfo;
          }
        }
      }
    }

    handleLeftMouseUp() {
      if (!window.game) return;
      const game = window.game;

      if (this.draggedItem && this.dragSource) {
        // Eğer gameplay alanına sürüklendiyse (y < 470) -> Yere bırak
        if (this.mouseY < CONFIG.ui.bottomPanelY) {
          game.dropItemToGround(this.draggedItem, this.dragSource);
        } else {
          // Alt panelde bir slota bırakıldı mı?
          const targetSlot = game.inventory.getSlotAt(this.mouseX, this.mouseY);
          if (targetSlot) {
            game.inventory.handleDrop(this.dragSource, targetSlot);
          }
        }
        this.draggedItem = null;
        this.dragSource = null;
      }
    }

    handleRightClick() {
      if (!window.game || this.mouseY < CONFIG.ui.bottomPanelY) return;
      const slotInfo = window.game.inventory.getSlotAt(this.mouseX, this.mouseY);
      if (slotInfo) {
        window.game.inventory.handleRightClick(slotInfo);
      }
    }
  }

  // ==========================================
  // 4. CAMERA (YATAY TAKİP LERP 0.1 & SHAKE)
  // ==========================================
  class Camera {
    constructor() {
      this.zoom = (typeof settings !== 'undefined') ? settings.cameraZoom : 1.0;
      this.x = 2800 - CONFIG.canvas.width / 2;
      this.y = 0;
      this.shakeIntensity = 0;
      this.shakeDuration = 0;
    }

    snapTo(targetX) {
      const targetCamX = targetX - CONFIG.canvas.width / 2;
      const maxCamX = CONFIG.gameplay.worldWidth - CONFIG.canvas.width;
      this.x = Math.max(0, Math.min(maxCamX, targetCamX));
    }

    update(targetX, dt) {
      const targetCamX = targetX - CONFIG.canvas.width / 2;
      const maxCamX = CONFIG.gameplay.worldWidth - CONFIG.canvas.width;
      const clampedTargetX = Math.max(0, Math.min(maxCamX, targetCamX));

      // Lerp 0.1 takip
      this.x += (clampedTargetX - this.x) * CONFIG.gameplay.cameraLerp;

      // Ekran sarsıntısı sönümleme
      if (this.shakeDuration > 0) {
        this.shakeDuration -= dt;
        if (this.shakeDuration <= 0) {
          this.shakeIntensity = 0;
        }
      }
    }

    shake(intensity, duration = 0.3) {
      const mult = (typeof settings !== 'undefined' && settings.screenShake !== undefined) ? settings.screenShake : 1.0;
      if (mult <= 0) return;
      this.shakeIntensity = intensity * mult;
      this.shakeDuration = duration;
    }

    screenToWorld(screenX, screenY) {
      const midX = CONFIG.canvas.width / 2;
      const midY = CONFIG.canvas.height / 2;
      const zoom = this.zoom || 1.0;
      const cameraX = this.getOffsetX();
      const cameraY = this.getOffsetY();

      const worldX = cameraX + midX + (screenX - midX) / zoom;
      const worldY = midY + (screenY - (midY + cameraY)) / zoom;
      return { x: worldX, y: worldY };
    }

    getOffsetX() {
      let ox = this.x;
      if (this.shakeIntensity > 0) {
        ox += (Math.random() - 0.5) * this.shakeIntensity * 2;
      }
      return ox;
    }

    getOffsetY() {
      let oy = 0;
      if (this.shakeIntensity > 0) {
        oy += (Math.random() - 0.5) * this.shakeIntensity * 2;
      }
      return oy;
    }
  }

  // ==========================================
  // 5. PARALLAX & ARKA PLAN
  // ==========================================
  class ParallaxBackground {
    constructor() {
      this.decorations = this.generateDecorations();
    }

    generateDecorations() {
      const list = [];
      const worldW = CONFIG.gameplay.worldWidth;

      // Uzak binalar ve silüetler (Katman 1 - 0.15 hız)
      for (let x = 50; x < worldW; x += 180 + Math.random() * 120) {
        list.push({ layer: 1, type: 'building', x: x, w: 90 + Math.random() * 80, h: 140 + Math.random() * 160 });
      }

      // Orta ağaçlar, tepeler ve terk edilmiş evler (Katman 2 - 0.4 hız)
      for (let x = 30; x < worldW; x += 120 + Math.random() * 140) {
        list.push({ layer: 2, type: Math.random() > 0.4 ? 'tree' : 'pine', x: x, h: 80 + Math.random() * 50 });
      }

      // Yakın dekorlar: arabalar, tabelalar, çitler, çalılar (Katman 3 - 0.75 hız)
      for (let x = 60; x < worldW; x += 160 + Math.random() * 180) {
        const types = ['car', 'sign', 'fence', 'bush', 'rock'];
        const chosen = types[Math.floor(Math.random() * types.length)];
        list.push({ layer: 3, type: chosen, x: x });
      }

      return list;
    }

    render(ctx, cameraX, chapterIndex) {
      // Chapter Renk Temaları
      let skyGrad;
      let layer1Color, layer2Color, groundColor, roadLineColor;

      if (chapterIndex === 1) {
        // Bölüm 1: Şehrin Kıyısı (Gündüz, yeşil temalı)
        skyGrad = ctx.createLinearGradient(0, 0, 0, 400);
        skyGrad.addColorStop(0, '#5fa8d3');
        skyGrad.addColorStop(1, '#cae9ff');
        layer1Color = '#94d2bd';
        layer2Color = '#2d6a4f';
        groundColor = '#1b4332';
        roadLineColor = '#fef08a';
      } else if (chapterIndex === 2) {
        // Bölüm 2: Terk Edilmiş Orman (Alacakaranlık, turuncu-mor temalı)
        skyGrad = ctx.createLinearGradient(0, 0, 0, 400);
        skyGrad.addColorStop(0, '#31103f');
        skyGrad.addColorStop(0.6, '#b83b5e');
        skyGrad.addColorStop(1, '#f08a5d');
        layer1Color = '#4a154b';
        layer2Color = '#2b2e4a';
        groundColor = '#1f1a24';
        roadLineColor = '#fed7aa';
      } else {
        // Bölüm 3 veya Sonsuz Mod: Karanlık Merkez (Gece, kırmızı/koyu temalı)
        skyGrad = ctx.createLinearGradient(0, 0, 0, 400);
        skyGrad.addColorStop(0, '#0f050b');
        skyGrad.addColorStop(0.7, '#300a12');
        skyGrad.addColorStop(1, '#4c0519');
        layer1Color = '#1e050c';
        layer2Color = '#160206';
        groundColor = '#110204';
        roadLineColor = '#f87171';
      }

      // 1. Gökyüzü
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, CONFIG.canvas.width, CONFIG.gameplay.yMax);

      // Yıldızlar (Gece veya Alacakaranlık)
      if (chapterIndex >= 2) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
        for (let i = 0; i < 40; i++) {
          const starX = ((i * 137 + 50) - (cameraX * 0.05)) % CONFIG.canvas.width;
          const starY = (i * 47) % 240;
          const sx = starX < 0 ? starX + CONFIG.canvas.width : starX;
          ctx.fillRect(sx, starY, (i % 3 === 0 ? 2 : 1.5), (i % 3 === 0 ? 2 : 1.5));
        }
      }

      // Ay veya Güneş
      ctx.save();
      if (chapterIndex === 3) {
        ctx.fillStyle = '#ef4444';
        ctx.shadowColor = '#dc2626';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(CONFIG.canvas.width - 250, 90, 36, 0, Math.PI * 2);
        ctx.fill();
      } else if (chapterIndex === 1) {
        ctx.fillStyle = '#fef08a';
        ctx.shadowColor = '#fde047';
        ctx.shadowBlur = 25;
        ctx.beginPath();
        ctx.arc(200, 80, 40, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = '#fdba74';
        ctx.shadowColor = '#fb923c';
        ctx.shadowBlur = 30;
        ctx.beginPath();
        ctx.arc(CONFIG.canvas.width / 2 + 100, 160, 45, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // 2. Katman 1: Uzak binalar (Hız 0.15)
      ctx.fillStyle = layer1Color;
      const l1Offset = cameraX * 0.15;
      for (const item of this.decorations) {
        if (item.layer === 1) {
          const drawX = (item.x - l1Offset) % (CONFIG.gameplay.worldWidth * 0.4);
          if (drawX > -150 && drawX < CONFIG.canvas.width + 150) {
            ctx.fillRect(drawX, CONFIG.gameplay.groundY - item.h, item.w, item.h);
            // Pencereler
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            for (let py = CONFIG.gameplay.groundY - item.h + 12; py < CONFIG.gameplay.groundY - 10; py += 22) {
              for (let px = drawX + 8; px < drawX + item.w - 8; px += 16) {
                ctx.fillRect(px, py, 7, 10);
              }
            }
            ctx.fillStyle = layer1Color;
          }
        }
      }

      // 3. Katman 2: Orta ağaçlar/tepeler (Hız 0.4)
      ctx.fillStyle = layer2Color;
      const l2Offset = cameraX * 0.4;
      for (const item of this.decorations) {
        if (item.layer === 2) {
          const drawX = (item.x - l2Offset) % (CONFIG.gameplay.worldWidth * 0.6);
          if (drawX > -100 && drawX < CONFIG.canvas.width + 100) {
            if (item.type === 'tree') {
              // Gövde
              ctx.fillRect(drawX + 8, CONFIG.gameplay.groundY - item.h, 10, item.h);
              // Yaprak çemberi
              ctx.beginPath();
              ctx.arc(drawX + 13, CONFIG.gameplay.groundY - item.h, 28, 0, Math.PI * 2);
              ctx.fill();
            } else {
              // Çam ağacı üçgeni
              ctx.beginPath();
              ctx.moveTo(drawX + 14, CONFIG.gameplay.groundY - item.h - 15);
              ctx.lineTo(drawX - 16, CONFIG.gameplay.groundY);
              ctx.lineTo(drawX + 44, CONFIG.gameplay.groundY);
              ctx.closePath();
              ctx.fill();
            }
          }
        }
      }

      // 4. Katman 3: Yakın dekorlar (Hız 0.75)
      const l3Offset = cameraX * 0.75;
      for (const item of this.decorations) {
        if (item.layer === 3) {
          const drawX = item.x - l3Offset;
          if (drawX > -120 && drawX < CONFIG.canvas.width + 120) {
            ctx.save();
            if (item.type === 'car') {
              // Terk edilmiş hurda araba / polis aracı
              ctx.fillStyle = '#334155';
              ctx.fillRect(drawX, CONFIG.gameplay.groundY - 26, 72, 22);
              ctx.fillRect(drawX + 14, CONFIG.gameplay.groundY - 44, 40, 20);
              // Kırık camlar
              ctx.fillStyle = '#64748b';
              ctx.fillRect(drawX + 18, CONFIG.gameplay.groundY - 41, 14, 14);
              ctx.fillRect(drawX + 36, CONFIG.gameplay.groundY - 41, 14, 14);
              // Cam çatlağı çizgisi
              ctx.strokeStyle = '#ffffff';
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(drawX + 22, CONFIG.gameplay.groundY - 40);
              ctx.lineTo(drawX + 29, CONFIG.gameplay.groundY - 30);
              ctx.stroke();
              // Farlar & ızgara
              ctx.fillStyle = '#94a3b8';
              ctx.fillRect(drawX + 68, CONFIG.gameplay.groundY - 22, 4, 7);
              // Tekerlekler
              ctx.fillStyle = '#0f172a';
              ctx.beginPath();
              ctx.arc(drawX + 15, CONFIG.gameplay.groundY - 5, 8.5, 0, Math.PI * 2);
              ctx.arc(drawX + 57, CONFIG.gameplay.groundY - 5, 8.5, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = '#64748b';
              ctx.beginPath();
              ctx.arc(drawX + 15, CONFIG.gameplay.groundY - 5, 3.5, 0, Math.PI * 2);
              ctx.arc(drawX + 57, CONFIG.gameplay.groundY - 5, 3.5, 0, Math.PI * 2);
              ctx.fill();
            } else if (item.type === 'sign') {
              // Otoyol / Tehlike Tabelası
              ctx.fillStyle = '#64748b';
              ctx.fillRect(drawX + 8, CONFIG.gameplay.groundY - 56, 4, 56);
              ctx.fillRect(drawX + 36, CONFIG.gameplay.groundY - 56, 4, 56);
              // Yeşil otoyol levhası
              ctx.fillStyle = '#15803d';
              ctx.fillRect(drawX - 6, CONFIG.gameplay.groundY - 72, 60, 26);
              ctx.strokeStyle = '#f8fafc';
              ctx.lineWidth = 1.5;
              ctx.strokeRect(drawX - 6, CONFIG.gameplay.groundY - 72, 60, 26);
              ctx.fillStyle = '#ffffff';
              ctx.font = 'bold 8.5px sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText('KARANTİNA', drawX + 24, CONFIG.gameplay.groundY - 60);
              ctx.font = '7.5px sans-serif';
              ctx.fillText('BÖLGESİ', drawX + 24, CONFIG.gameplay.groundY - 50);
            } else if (item.type === 'fence') {
              // Tel Örgülü Çit
              ctx.strokeStyle = '#94a3b8';
              ctx.lineWidth = 2;
              ctx.strokeRect(drawX, CONFIG.gameplay.groundY - 28, 38, 28);
              ctx.lineWidth = 0.8;
              ctx.beginPath();
              ctx.moveTo(drawX, CONFIG.gameplay.groundY - 28);
              ctx.lineTo(drawX + 38, CONFIG.gameplay.groundY);
              ctx.moveTo(drawX, CONFIG.gameplay.groundY);
              ctx.lineTo(drawX + 38, CONFIG.gameplay.groundY - 28);
              ctx.stroke();
            } else if (item.type === 'rock') {
              // Detaylı Kaya
              ctx.fillStyle = '#475569';
              ctx.beginPath();
              ctx.arc(drawX + 14, CONFIG.gameplay.groundY - 6, 14, Math.PI, 0);
              ctx.fill();
              ctx.fillStyle = '#64748b'; // Işık vuran üst yüzey
              ctx.beginPath();
              ctx.arc(drawX + 11, CONFIG.gameplay.groundY - 11, 8, Math.PI, 0);
              ctx.fill();
            } else {
              // Çalı / Ağaçcık
              ctx.fillStyle = '#14532d';
              ctx.beginPath();
              ctx.arc(drawX + 12, CONFIG.gameplay.groundY - 10, 15, 0, Math.PI * 2);
              ctx.arc(drawX + 28, CONFIG.gameplay.groundY - 14, 18, 0, Math.PI * 2);
              ctx.arc(drawX + 44, CONFIG.gameplay.groundY - 9, 13, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = '#16a34a'; // Yaprak aydınlığı
              ctx.beginPath();
              ctx.arc(drawX + 26, CONFIG.gameplay.groundY - 18, 11, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
          }
        }
      }

      // 5. Zemin & Yol Çizgisi (y=400..470)
      ctx.fillStyle = '#1e2229'; // Asfalt zemin
      ctx.fillRect(0, CONFIG.gameplay.groundY, CONFIG.canvas.width, CONFIG.gameplay.yMax - CONFIG.gameplay.groundY);

      // Yol kenar bordürü / çizgisi (y=400)
      ctx.fillStyle = groundColor;
      ctx.fillRect(0, CONFIG.gameplay.groundY - 4, CONFIG.canvas.width, 5);

      // Sokak Lambaları & Yere Vuran Işık Konileri
      const lampPeriod = 520;
      const firstLamp = Math.floor((cameraX - 100) / lampPeriod) * lampPeriod;
      for (let lx = firstLamp; lx < cameraX + CONFIG.canvas.width + 100; lx += lampPeriod) {
        const sx = lx - cameraX;
        // Direk
        ctx.fillStyle = '#334155';
        ctx.fillRect(sx, CONFIG.gameplay.groundY - 85, 4.5, 85);
        // Lamba kolu
        ctx.fillRect(sx - 14, CONFIG.gameplay.groundY - 88, 18, 4);
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(sx - 14, CONFIG.gameplay.groundY - 84, 8, 3.5);

        // Yere vuran yumuşak aydınlatma konisi
        const lightGrad = ctx.createRadialGradient(sx - 10, CONFIG.gameplay.groundY - 80, 5, sx - 10, CONFIG.gameplay.groundY + 30, 95);
        lightGrad.addColorStop(0, 'rgba(254, 240, 138, 0.18)');
        lightGrad.addColorStop(1, 'rgba(254, 240, 138, 0)');
        ctx.fillStyle = lightGrad;
        ctx.beginPath();
        ctx.moveTo(sx - 10, CONFIG.gameplay.groundY - 80);
        ctx.lineTo(sx - 75, CONFIG.gameplay.yMax);
        ctx.lineTo(sx + 55, CONFIG.gameplay.yMax);
        ctx.closePath();
        ctx.fill();
      }

      // Kesik yol şeritleri (y=435)
      ctx.fillStyle = roadLineColor;
      const stripeW = 45;
      const stripeGap = 45;
      const period = stripeW + stripeGap;
      const startX = -((cameraX) % period);
      for (let sx = startX; sx < CONFIG.canvas.width; sx += period) {
        ctx.fillRect(sx, 434, stripeW, 5);
      }
    }
  }

  // ==========================================
  // 6. PARTICLES & FLOATING TEXTS
  // ==========================================
  class ParticleSystem {
    constructor() {
      this.particles = [];
      this.floatingTexts = [];
    }

    addBlood(x, y, count = 8) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 40 + Math.random() * 140;
        this.particles.push({
          type: 'blood',
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 50,
          size: 2 + Math.random() * 3,
          color: Math.random() > 0.4 ? '#dc2626' : '#991b1b',
          life: 0.3 + Math.random() * 0.4,
          maxLife: 0.7,
          gravity: 800
        });
      }
      // Yerde kan lekesi bırak
      if (Math.random() > 0.3) {
        this.addBloodDecal(x + (Math.random() - 0.5) * 16, CONFIG.gameplay.groundY - 1);
      }
    }

    addBloodDecal(x, y) {
      this.particles.push({
        type: 'decal',
        x, y: Math.min(y, CONFIG.gameplay.groundY - 1),
        sizeX: 6 + Math.random() * 8,
        sizeY: 2 + Math.random() * 2.5,
        life: 7.0,
        maxLife: 7.0,
        color: Math.random() > 0.5 ? '#7f1d1d' : '#991b1b'
      });
    }

    addShellCasing(x, y, vx, vy) {
      this.particles.push({
        type: 'casing',
        x, y,
        vx, vy,
        angle: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 30,
        life: 2.2,
        maxLife: 2.2,
        gravity: 850
      });
    }

    addMuzzleSmoke(x, y) {
      for (let i = 0; i < 3; i++) {
        this.particles.push({
          type: 'smoke',
          x: x + (Math.random() - 0.5) * 6,
          y: y + (Math.random() - 0.5) * 6,
          vx: (Math.random() - 0.5) * 20,
          vy: -15 - Math.random() * 20,
          size: 3 + Math.random() * 3,
          growth: 10,
          life: 0.4 + Math.random() * 0.2,
          maxLife: 0.6,
          color: 'rgba(203, 213, 225, 0.4)'
        });
      }
    }

    addExplosion(x, y, radius = 150) {
      for (let i = 0; i < 45; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 60 + Math.random() * radius * 1.8;
        const colors = ['#f59e0b', '#ef4444', '#f97316', '#78716c', '#facc15'];
        this.particles.push({
          type: 'explosion',
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 60,
          size: 4 + Math.random() * 7,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 0.4 + Math.random() * 0.4,
          maxLife: 0.8,
          gravity: 400
        });
      }
    }

    addSparks(x, y, count = 6, color = '#facc15') {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 80 + Math.random() * 120;
        this.particles.push({
          type: 'spark',
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 60,
          size: 2,
          color: color,
          life: 0.2 + Math.random() * 0.25,
          maxLife: 0.45,
          gravity: 600
        });
      }
    }

    addLevelUpExplosion(x, y) {
      for (let i = 0; i < 36; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 60 + Math.random() * 220;
        const colors = ['#facc15', '#38bdf8', '#4ade80', '#c084fc', '#ffffff'];
        this.particles.push({
          type: 'spark',
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 80,
          size: 2.5 + Math.random() * 2.5,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 0.6 + Math.random() * 0.5,
          maxLife: 1.1,
          gravity: 420
        });
      }
    }

    addFloatingText(text, x, y, color = '#ffffff', fontSize = 16) {
      this.floatingTexts.push({
        text, x, y,
        color, fontSize,
        life: 1.1,
        maxLife: 1.1,
        vy: -40
      });
    }

    update(dt) {
      // Partikül güncellemesi
      for (let i = this.particles.length - 1; i >= 0; i--) {
        const p = this.particles[i];
        p.life -= dt;
        if (p.life <= 0) {
          this.particles.splice(i, 1);
          continue;
        }

        if (p.type === 'casing') {
          p.vy += p.gravity * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.angle += p.vRot * dt;
          if (p.y >= CONFIG.gameplay.groundY) {
            p.y = CONFIG.gameplay.groundY;
            p.vy *= -0.35;
            p.vx *= 0.6;
            p.vRot *= 0.5;
          }
        } else if (p.type === 'smoke') {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.size += (p.growth || 8) * dt;
        } else if (p.type === 'decal') {
          // Statik kan lekesi
        } else {
          p.vy += p.gravity * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          // Zemine çarpma
          if (p.y > CONFIG.gameplay.groundY) {
            p.y = CONFIG.gameplay.groundY;
            p.vx *= 0.6;
            p.vy = 0;
          }
        }
      }

      // Kayan metinler
      for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
        const ft = this.floatingTexts[i];
        ft.life -= dt;
        if (ft.life <= 0) {
          this.floatingTexts.splice(i, 1);
          continue;
        }
        ft.y += ft.vy * dt;
      }
    }

    render(ctx, cameraX) {
      ctx.save();
      // Partiküller
      for (const p of this.particles) {
        const screenX = p.x - cameraX;
        if (screenX < -30 || screenX > CONFIG.canvas.width + 30) continue;
        const alpha = Math.max(0, p.life / p.maxLife);
        ctx.globalAlpha = alpha;

        if (p.type === 'casing') {
          ctx.save();
          ctx.translate(screenX, p.y);
          ctx.rotate(p.angle);
          ctx.fillStyle = '#facc15';
          ctx.fillRect(-2.5, -1, 5, 2);
          ctx.strokeStyle = '#ca8a04';
          ctx.lineWidth = 0.5;
          ctx.strokeRect(-2.5, -1, 5, 2);
          ctx.restore();
        } else if (p.type === 'smoke') {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(screenX, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        } else if (p.type === 'decal') {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.ellipse(screenX, p.y, p.sizeX, p.sizeY, 0, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(screenX, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Kayan Yazılar
      for (const ft of this.floatingTexts) {
        const screenX = ft.x - cameraX;
        if (screenX < -100 || screenX > CONFIG.canvas.width + 100) continue;
        const alpha = Math.max(0, ft.life / ft.maxLife);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = ft.color;
        ctx.font = `bold ${ft.fontSize}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.shadowColor = '#000000';
        ctx.shadowBlur = 4;
        ctx.fillText(ft.text, screenX, ft.y);
      }
      ctx.restore();
    }
  }

  // ==========================================
  // 7. WEAPONS & PROJECTILES
  // ==========================================
  class Projectile {
    constructor(params) {
      this.x = params.x;
      this.y = params.y;
      this.vx = params.vx;
      this.vy = params.vy;
      this.damage = params.damage;
      this.speed = params.speed;
      this.isPlayer = params.isPlayer;
      this.isRocket = params.isRocket || false;
      this.aoeRadius = params.aoeRadius || 0;
      this.maxRange = params.maxRange || 3000;
      this.traveled = 0;
      this.color = params.color || '#facc15';
      this.active = true;
    }

    update(dt) {
      const step = Math.hypot(this.vx, this.vy) * dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.traveled += step;

      // Menzil veya zemin sınırları
      if (this.traveled >= this.maxRange || this.y >= CONFIG.gameplay.groundY) {
        this.active = false;
        if (this.isRocket && window.game) {
          window.game.explodeRocket(this.x, Math.min(this.y, CONFIG.gameplay.groundY), this.damage, this.aoeRadius);
        }
      }
    }

    render(ctx, cameraX) {
      const sx = this.x - cameraX;
      if (sx < -30 || sx > CONFIG.canvas.width + 30) return;

      ctx.save();
      if (this.isRocket) {
        // Roket gövdesi ve arkasında alev
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(sx, this.y, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#f97316';
        ctx.beginPath();
        ctx.arc(sx - (this.vx > 0 ? 8 : -8), this.y, 3, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // Mermi / saçma çizgisi
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(sx, this.y);
        ctx.lineTo(sx - (this.vx * 0.015), this.y - (this.vy * 0.015));
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // ==========================================
  // 8. ITEMS & INVENTORY
  // ==========================================
  class GroundItem {
    constructor(x, item) {
      this.x = x;
      this.y = CONFIG.gameplay.groundY - 14;
      this.item = item;
      this.floatTime = Math.random() * Math.PI * 2;
      this.active = true;
    }

    update(dt) {
      this.floatTime += dt * 3.5;
    }

    render(ctx, cameraX) {
      const sx = this.x - cameraX;
      if (sx < -40 || sx > CONFIG.canvas.width + 40) return;

      const floatY = this.y + Math.sin(this.floatTime) * 5;
      const color = CONFIG.rarityColors[this.item.rarity] || '#ffffff';

      ctx.save();
      // Yerde parlama halesi (havaya kalktıkça mesafe ile solar)
      const distFromGround = Math.max(0, (CONFIG.gameplay.groundY - 14) - this.y);
      const shadowAlpha = Math.max(0, 1 - distFromGround / 45) * (0.25 + Math.sin(this.floatTime) * 0.15);
      if (shadowAlpha > 0.01) {
        ctx.fillStyle = color;
        ctx.globalAlpha = shadowAlpha;
        ctx.beginPath();
        ctx.ellipse(sx, CONFIG.gameplay.groundY - 3, 16, 5, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // İkon kutusu / çizimi
      ctx.globalAlpha = 1.0;
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(sx - 12, floatY - 12, 24, 24);
      ctx.strokeRect(sx - 12, floatY - 12, 24, 24);

      // Eşya sembolü
      Inventory.drawItemIcon(ctx, this.item, sx, floatY, 20);

      // Yerdeki eşya adet rozeti (varsa)
      if (this.item.count && this.item.count > 1) {
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 10px monospace';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#000000';
        ctx.shadowBlur = 4;
        ctx.fillText(`x${this.item.count}`, sx, floatY - 14);
        ctx.shadowBlur = 0;
      }

      ctx.restore();
    }
  }

  // XP KÜRESİ (CANAVARLARDAN DÜŞEN VE MANYETİK ÇEKİLEN XP KRİSTALİ)
  class XpOrb {
    constructor(x, y, value) {
      this.x = x;
      this.y = y || (CONFIG.gameplay.groundY - 14);
      this.value = value || 10;
      this.radius = value >= 100 ? 7.5 : (value >= 30 ? 6 : 4.5);
      this.floatTime = Math.random() * Math.PI * 2;
      this.active = true;
      this.color = value >= 100 ? '#facc15' : (value >= 30 ? '#a855f7' : '#38bdf8');
    }

    update(dt) {
      this.floatTime += dt * 4.5;
    }

    render(ctx, cameraX) {
      const sx = this.x - cameraX;
      if (sx < -30 || sx > CONFIG.canvas.width + 30) return;
      const fy = this.y + Math.sin(this.floatTime) * 4;

      ctx.save();
      // Yerde parlama halesi
      ctx.fillStyle = this.color;
      ctx.globalAlpha = 0.35 + Math.sin(this.floatTime) * 0.15;
      ctx.beginPath();
      ctx.arc(sx, fy, this.radius + 5, 0, Math.PI * 2);
      ctx.fill();

      // Kristal Elmas Gövde
      ctx.globalAlpha = 1.0;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(sx, fy - this.radius);
      ctx.lineTo(sx + this.radius, fy);
      ctx.lineTo(sx, fy + this.radius);
      ctx.lineTo(sx - this.radius, fy);
      ctx.closePath();
      ctx.fill();

      // İç Işıma ve Kontur
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Çekirdek
      ctx.fillStyle = this.color;
      ctx.fillRect(sx - 1.5, fy - 1.5, 3, 3);
      ctx.restore();
    }
  }

  class Inventory {
    constructor(player) {
      this.player = player;
      // 18 slotluk envanter tablosu
      this.grid = new Array(18).fill(null);
      // Ekipman yuvaları
      this.equipment = {
        helmet: null,
        armor: null,
        outfit: null,
        backpack: null
      };
      this.initStartingItems();
    }

    initStartingItems() {
      // Başlangıç: hand slot 1'de Paslı Kılıç, slot 2'de Tabanca, slot 3 boş
      this.player.handSlots[0] = { ...CONFIG.meleeWeapons.rusty_sword };
      this.player.handSlots[1] = {
        ...CONFIG.firearms.pistol,
        currentMag: CONFIG.firearms.pistol.magSize
      };
      this.player.handSlots[2] = null;
    }

    getMaxUnlockedSlots() {
      const bp = this.equipment.backpack;
      if (!bp) return 6; // Çantasız: 6 slot (1. satır açık)
      if (bp.level === 1) return 10; // Küçük çanta (Yeşil): 10 slot (+4 slot, 8 kilitli)
      if (bp.level === 2) return 14; // Orta çanta (Mavi): 14 slot (+8 slot, 4 kilitli)
      return 18; // Büyük çanta (Sarı / Altın): 18 slot (Tüm 18 slot açık!)
    }

    addItem(item) {
      if (!item) return false;
      const maxSlots = this.getMaxUnlockedSlots();

      // Medkitleri renge / seviyeye göre yığınla (max 10 stack)
      if (item.type === 'medkit') {
        item.count = item.count || 1;
        // 1. Önce aynı tür/iyileştirme gücündeki mevcut yığınları doldur
        for (let i = 0; i < maxSlots; i++) {
          const existing = this.grid[i];
          if (existing && existing.type === 'medkit' && existing.healAmount === item.healAmount) {
            existing.count = existing.count || 1;
            if (existing.count < 10) {
              const space = 10 - existing.count;
              const transfer = Math.min(space, item.count);
              existing.count += transfer;
              item.count -= transfer;
              if (item.count <= 0) return true;
            }
          }
        }
        // 2. Kalan varsa ilk boş slota koy
        if (item.count > 0) {
          for (let i = 0; i < maxSlots; i++) {
            if (!this.grid[i]) {
              this.grid[i] = { ...item };
              item.count = 0;
              return true;
            }
          }
          return false; // Boş yer kalmadı
        }
        return true;
      }

      // Diğer eşyalar için normal tek slot yerleşimi
      for (let i = 0; i < maxSlots; i++) {
        if (!this.grid[i]) {
          this.grid[i] = item;
          return true;
        }
      }
      return false; // Envanter dolu
    }

    autoEquipBest(slotKey) {
      if (!['helmet', 'armor', 'outfit', 'backpack'].includes(slotKey)) return;

      const slotNames = {
        helmet: 'Kask',
        armor: 'Zırh',
        outfit: 'Kıyafet',
        backpack: 'Çanta'
      };
      const typeName = slotNames[slotKey] || 'Ekipman';

      // Nadirlik Rütbeleri: Gri (1) < Yeşil (2) < Mavi (3) < Mor (4) < Altın (5)
      const rarityRank = {
        common: 1,      // Gri: Sıradan (en düşük)
        uncommon: 2,    // Yeşil: Grinin bir üstü (nadir)
        rare: 3,        // Mavi: Yeşilin bir üstü (ortalama/nadir)
        epic: 4,        // Mor: Mavinin bir üstü (destansı)
        legendary: 5    // Altın: Morun bir üstü (efsanevi)
      };

      const calcScore = (item) => {
        if (!item || item.type !== slotKey) return -1;
        const rank = rarityRank[item.rarity] || 1;
        const stat = (slotKey === 'backpack' ? (item.extraSlots || 0) : (item.armorValue || 0));
        return rank * 1000 + stat;
      };

      const currentItem = this.equipment[slotKey];
      const currentScore = calcScore(currentItem);

      let bestScore = currentScore;
      let bestCandidate = null;

      // 1. Yerdeki eşyaları tara (Haritadaki tüm yerdeki eşyalar)
      if (window.game && window.game.groundItems) {
        for (let i = 0; i < window.game.groundItems.length; i++) {
          const gi = window.game.groundItems[i];
          if (gi.item && gi.item.type === slotKey) {
            const score = calcScore(gi.item);
            const dist = Math.abs(this.player.x - gi.x);
            if (score > bestScore) {
              bestScore = score;
              bestCandidate = { source: 'ground', groundItemRef: gi, item: gi.item, score, dist };
            } else if (score === bestScore && bestCandidate && bestCandidate.source === 'ground' && dist < bestCandidate.dist) {
              bestCandidate = { source: 'ground', groundItemRef: gi, item: gi.item, score, dist };
            }
          }
        }
      }

      // 2. Envanter gridindeki eşyaları tara
      const maxSlots = this.getMaxUnlockedSlots();
      for (let i = 0; i < maxSlots; i++) {
        const invItem = this.grid[i];
        if (invItem && invItem.type === slotKey) {
          const score = calcScore(invItem);
          if (score > bestScore) {
            bestScore = score;
            bestCandidate = { source: 'inv', index: i, item: invItem, score, dist: 0 };
          }
        }
      }

      // Eğer daha iyi bir eşya bulunamadıysa kullanıcıya bilgi ver
      if (!bestCandidate) {
        if (currentItem) {
          window.game.particles.addFloatingText(`Zaten en iyi ${typeName} takılı!`, this.player.x, this.player.y - 45, '#facc15');
        } else {
          window.game.particles.addFloatingText(`Etrafta veya çantada ${typeName} yok!`, this.player.x, this.player.y - 45, '#94a3b8');
        }
        sound.playEmptyClick();
        return;
      }

      // En iyi adayı kuşan
      const newItem = bestCandidate.item;
      const oldItem = currentItem;

      if (bestCandidate.source === 'ground') {
        // Yerden kaldır
        const giIndex = window.game.groundItems.indexOf(bestCandidate.groundItemRef);
        if (giIndex !== -1) {
          window.game.groundItems.splice(giIndex, 1);
        }
        // Değiştirilen eski eşyayı çantaya DEĞİL, DİREKT YERE AT
        if (oldItem) {
          window.game.groundItems.push(new GroundItem(this.player.x, oldItem));
          window.game.particles.addFloatingText(`Eski ${oldItem.name} yere atıldı`, this.player.x, this.player.y - 35, '#94a3b8');
        }
        this.equipment[slotKey] = newItem;
      } else if (bestCandidate.source === 'inv') {
        // Envanterdeki yuvayı boşalt
        this.grid[bestCandidate.index] = null;
        // Değiştirilen eski eşyayı çantaya DEĞİL, DİREKT YERE AT
        if (oldItem) {
          window.game.groundItems.push(new GroundItem(this.player.x, oldItem));
          window.game.particles.addFloatingText(`Eski ${oldItem.name} yere atıldı`, this.player.x, this.player.y - 35, '#94a3b8');
        }
        this.equipment[slotKey] = newItem;
      }

      this.cleanOverflownSlots();
      sound.playItemUse();
      const rColor = CONFIG.rarityColors[newItem.rarity] || '#22c55e';
      window.game.particles.addFloatingText(`✓ En İyi ${newItem.name} Kuşanıldı!`, this.player.x, this.player.y - 50, rColor);
    }

    getSlotAt(mx, my) {
      // 1. Envanter Grid (x: 20..440, y: 494..680)
      const g = CONFIG.ui.invGrid;
      for (let r = 0; r < g.rows; r++) {
        for (let c = 0; c < g.cols; c++) {
          const index = r * g.cols + c;
          const sx = g.x + c * (g.slotSize + g.gapX);
          const sy = g.y + r * (g.slotSize + g.gapY);
          if (mx >= sx && mx <= sx + g.slotSize && my >= sy && my <= sy + g.slotSize) {
            return { type: 'inv', index, id: `inv_${index}`, x: sx, y: sy, size: g.slotSize };
          }
        }
      }

      // 2. Karakter Ekipman Slotları (x: 460..700)
      const eqSlots = [
        { key: 'helmet', name: 'Kask', x: 553, y: 494, size: 54 },
        { key: 'armor', name: 'Zırh', x: 480, y: 564, size: 54 },
        { key: 'backpack', name: 'Çanta', x: 626, y: 564, size: 54 },
        { key: 'outfit', name: 'Kıyafet', x: 553, y: 634, size: 54 }
      ];
      for (const eq of eqSlots) {
        if (mx >= eq.x && mx <= eq.x + eq.size && my >= eq.y && my <= eq.y + eq.size) {
          return { type: 'equip', key: eq.key, id: `equip_${eq.key}`, x: eq.x, y: eq.y, size: eq.size };
        }
      }

      // 3. Hand Slotlar (x: 720..800)
      const hs = CONFIG.ui.handSlots;
      for (let i = 0; i < 3; i++) {
        const sy = hs.y + i * (hs.height + hs.gapY);
        if (mx >= hs.x && mx <= hs.x + hs.width && my >= sy && my <= sy + hs.height) {
          return { type: 'hand', index: i, id: `hand_${i}`, x: hs.x, y: sy, width: hs.width, height: hs.height };
        }
      }

      return null;
    }

    getItemFromSlot(slot) {
      if (slot.type === 'inv') return this.grid[slot.index];
      if (slot.type === 'equip') return this.equipment[slot.key];
      if (slot.type === 'hand') return this.player.handSlots[slot.index];
      return null;
    }

    setItemToSlot(slot, item) {
      if (slot.type === 'inv') this.grid[slot.index] = item;
      else if (slot.type === 'equip') this.equipment[slot.key] = item;
      else if (slot.type === 'hand') this.player.handSlots[slot.index] = item;
    }

    cleanOverflownSlots() {
      const maxSlots = this.getMaxUnlockedSlots();
      for (let i = maxSlots; i < 18; i++) {
        if (this.grid[i]) {
          if (window.game) {
            window.game.groundItems.push(new GroundItem(this.player.x, this.grid[i]));
            window.game.particles.addFloatingText('Eşya yere düştü (Çanta çıkarıldı)', this.player.x, this.player.y - 40, '#facc15');
          }
          this.grid[i] = null;
        }
      }
    }

    handleDoubleClick(slot) {
      const item = this.getItemFromSlot(slot);
      if (!item) return;

      // Ekipman eşyasına çift tıkla -> ilgili slota tak (eski eşyayı çantaya değil direk yere at)
      if (['helmet', 'armor', 'outfit', 'backpack'].includes(item.type)) {
        if (slot.type === 'inv') {
          const oldEquip = this.equipment[item.type];
          this.equipment[item.type] = item;
          this.grid[slot.index] = null;
          if (oldEquip) {
            window.game.groundItems.push(new GroundItem(this.player.x, oldEquip));
            window.game.particles.addFloatingText(`Eski ${oldEquip.name} yere atıldı`, this.player.x, this.player.y - 35, '#94a3b8');
          }
          this.cleanOverflownSlots();
          sound.playItemUse();
          return;
        }
      }

      // Silaha çift tıkla -> ilk boş hand slot'a veya aktif olana
      if (item.type === 'weapon') {
        if (slot.type === 'inv') {
          let targetHand = -1;
          for (let i = 0; i < 3; i++) {
            if (!this.player.handSlots[i]) {
              targetHand = i;
              break;
            }
          }
          if (targetHand === -1) targetHand = this.player.activeHandIndex;
          const oldHand = this.player.handSlots[targetHand];
          this.player.handSlots[targetHand] = item;
          this.grid[slot.index] = oldHand;
          sound.playItemUse();
          return;
        }
      }

      // Medkit kullanımı (çift tık veya sağ tık)
      if (item.type === 'medkit') {
        this.player.useMedkit(item, slot);
      }
    }

    handleRightClick(slot) {
      // Ekipman yuvasına sağ tık: Yerdeki ve çantadaki en güçlü eşyayı otomatik tak
      if (slot.type === 'equip') {
        this.autoEquipBest(slot.key);
        return;
      }

      const item = this.getItemFromSlot(slot);
      if (!item) return;

      // Medkit kullanımı (çift tık veya sağ tık)
      if (item.type === 'medkit') {
        this.player.useMedkit(item, slot);
        return;
      }

      // Hand slottan envantere geri alma
      if (slot.type === 'hand') {
        const added = this.addItem(item);
        if (added) {
          this.setItemToSlot(slot, null);
          this.cleanOverflownSlots();
          sound.playItemUse();
        } else {
          window.game.particles.addFloatingText('Envanter dolu!', this.player.x, this.player.y - 40, '#ef4444');
        }
      }
    }

    handleDrop(fromSlot, toSlot) {
      const fromItem = this.getItemFromSlot(fromSlot);
      if (!fromItem) return;

      // Kilitli slot kontrolü
      if (toSlot.type === 'inv' && toSlot.index >= this.getMaxUnlockedSlots()) {
        window.game.particles.addFloatingText('Slot Kilitli!', this.player.x, this.player.y - 40, '#ef4444');
        return;
      }

      // Ekipman kısıtlaması kontrolü
      if (toSlot.type === 'equip') {
        if (fromItem.type !== toSlot.key) {
          window.game.particles.addFloatingText('Bu yuvaya takılamaz!', this.player.x, this.player.y - 40, '#ef4444');
          return;
        }
      }

      // Hand slot sadece silah kabul eder
      if (toSlot.type === 'hand' && fromItem.type !== 'weapon') {
        window.game.particles.addFloatingText('Sadece silah takılabilir!', this.player.x, this.player.y - 40, '#ef4444');
        return;
      }

      // Değiş tokuş / taşıma
      const toItem = this.getItemFromSlot(toSlot);

      // Medkitleri birleştirme (Stacking - max 10)
      if (fromItem.type === 'medkit' && toItem && toItem.type === 'medkit' && toItem.healAmount === fromItem.healAmount) {
        toItem.count = toItem.count || 1;
        fromItem.count = fromItem.count || 1;
        if (toItem.count < 10) {
          const space = 10 - toItem.count;
          const transfer = Math.min(space, fromItem.count);
          toItem.count += transfer;
          fromItem.count -= transfer;
          if (fromItem.count <= 0) {
            this.setItemToSlot(fromSlot, null);
          }
          this.cleanOverflownSlots();
          sound.playItemUse();
          return;
        }
      }

      // Ekipman yuvasına sürüklenince eski eşyayı çantaya değil direk yere at
      if (toSlot.type === 'equip' && toItem) {
        window.game.groundItems.push(new GroundItem(this.player.x, toItem));
        window.game.particles.addFloatingText(`Eski ${toItem.name} yere atıldı`, this.player.x, this.player.y - 35, '#94a3b8');
        this.setItemToSlot(toSlot, fromItem);
        this.setItemToSlot(fromSlot, null);
        this.cleanOverflownSlots();
        sound.playItemUse();
        return;
      }

      // Geriye takılan eşyanın da kaynaktaki kısıtlamaya uygunluğu kontrolü
      if (toItem) {
        if (fromSlot.type === 'equip' && toItem.type !== fromSlot.key) return;
        if (fromSlot.type === 'hand' && toItem.type !== 'weapon') return;
      }

      this.setItemToSlot(toSlot, fromItem);
      this.setItemToSlot(fromSlot, toItem);
      this.cleanOverflownSlots();
      sound.playItemUse();
    }

    static drawItemIcon(ctx, item, x, y, size) {
      if (!item) return;
      ctx.save();
      ctx.translate(x, y);

      const color = CONFIG.rarityColors[item.rarity] || '#ffffff';
      const s = size / 32;

      if (item.type === 'weapon') {
        if (item.subType === 'melee') {
          // KILIÇLAR
          ctx.save();
          ctx.rotate(-Math.PI / 4);

          if (item.id === 'rusty_sword') {
            // Paslı Kılıç: Eskimiş, çentikli bıçak ve bakır sarımlı kabza
            ctx.fillStyle = '#854d0e';
            ctx.strokeStyle = '#a16207';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(-2 * s, 6 * s);
            ctx.lineTo(-2 * s, -12 * s);
            ctx.lineTo(0, -16 * s);
            ctx.lineTo(2 * s, -12 * s);
            ctx.lineTo(2 * s, 6 * s);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // Çentikler
            ctx.fillStyle = '#451a03';
            ctx.fillRect(0, -6 * s, 2 * s, 2 * s);
            ctx.fillRect(-2 * s, -10 * s, 1.5 * s, 1.5 * s);
            // Muhafaza ve kabza

            ctx.fillRect(-5 * s, 6 * s, 10 * s, 2.5 * s);

          } else if (item.id === 'steel_sword') {

            ctx.fillStyle = '#e2e8f0';
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-2.5 * s, 6 * s);
            ctx.lineTo(-2.5 * s, -13 * s);
            ctx.lineTo(0, -17 * s);
            ctx.lineTo(2.5 * s, -13 * s);
            ctx.lineTo(2.5 * s, 6 * s);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // Orta oluk
            ctx.strokeStyle = '#64748b';
            ctx.beginPath();
            ctx.moveTo(0, 5 * s);
            ctx.lineTo(0, -12 * s);
            ctx.stroke();
            // Çelik muhafaza
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(-6 * s, 6 * s, 12 * s, 2.5 * s);
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(-1.5 * s, 8.5 * s, 3 * s, 6 * s);
            // Yuvarlak topuz
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc(0, 15.5 * s, 2.5 * s, 0, Math.PI * 2);
            ctx.fill();
          } else if (item.id === 'katana') {
            // Katana: Kavisli gümüş samuray kılıcı ve altın tsuba
            ctx.strokeStyle = '#f8fafc';
            ctx.lineWidth = 2.5 * s;
            ctx.beginPath();
            ctx.moveTo(0, 6 * s);
            ctx.quadraticCurveTo(-4 * s, -6 * s, -1 * s, -17 * s);
            ctx.stroke();
            // Sırt hattı
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1 * s;
            ctx.beginPath();
            ctx.moveTo(1 * s, 6 * s);
            ctx.quadraticCurveTo(-3 * s, -6 * s, 0, -17 * s);
            ctx.stroke();
            // Altın Tsuba
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            ctx.ellipse(0, 6 * s, 5 * s, 2.5 * s, 0, 0, Math.PI * 2);
            ctx.fill();
            // Kırmızı sap
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(-1.5 * s, 8 * s, 3 * s, 7 * s);
          } else if (item.id === 'war_sword') {
            // Savaş Kılıcı: Ağır geniş gövde, kan rünü ve mor boynuzlu muhafaza
            ctx.fillStyle = '#475569';
            ctx.strokeStyle = '#c084fc';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-4 * s, 6 * s);
            ctx.lineTo(-4 * s, -12 * s);
            ctx.lineTo(-2 * s, -14 * s);
            ctx.lineTo(0, -18 * s);
            ctx.lineTo(2 * s, -14 * s);
            ctx.lineTo(4 * s, -12 * s);
            ctx.lineTo(4 * s, 6 * s);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // Kan oluğu
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(0, 4 * s);
            ctx.lineTo(0, -10 * s);
            ctx.stroke();
            // Muhafaza
            ctx.fillStyle = '#7e22ce';
            ctx.beginPath();
            ctx.moveTo(-7 * s, 4 * s);
            ctx.lineTo(0, 6.5 * s);
            ctx.lineTo(7 * s, 4 * s);
            ctx.lineTo(5 * s, 8.5 * s);
            ctx.lineTo(-5 * s, 8.5 * s);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(-2 * s, 8.5 * s, 4 * s, 7 * s);
          } else {
            // Efsanevi Kılıç: Altın ışıltı, melek kanatları ve yakut mücevher
            ctx.shadowColor = '#f59e0b';
            ctx.shadowBlur = 8 * s;
            ctx.fillStyle = '#fef08a';
            ctx.strokeStyle = '#eab308';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-3.5 * s, 6 * s);
            ctx.lineTo(-3.5 * s, -13 * s);

            ctx.lineTo(3.5 * s, -13 * s);
            ctx.lineTo(3.5 * s, 6 * s);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // Işıma
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-1 * s, -14 * s, 2 * s, 18 * s);
            // Kanatlı muhafaza
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.moveTo(-8 * s, 3 * s);
            ctx.lineTo(0, 7 * s);
            ctx.lineTo(8 * s, 3 * s);
            ctx.lineTo(6 * s, 9 * s);
            ctx.lineTo(-6 * s, 9 * s);
            ctx.closePath();
            ctx.fill();
            // Sap ve yakut taş
            ctx.fillStyle = '#78350f';
            ctx.fillRect(-1.5 * s, 9 * s, 3 * s, 6 * s);
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(0, 16.5 * s, 3 * s, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        } else {
          // ATEŞLİ SİLAHLAR
          ctx.save();
          if (item.id === 'pistol') {
            // Tabanca: Siyah sürgü, tetik korkuluğu, namlu
            ctx.fillStyle = '#334155';
            ctx.fillRect(-10 * s, -5 * s, 18 * s, 6 * s);

            } else {
              // M4A1 Fallback: Taktik tÃ¼fek, ÅŸarjÃ¶r, el kundaÄŸÄ±, dÃ¼rbÃ¼n
              ctx.fillStyle = '#1e293b';
              ctx.fillRect(-14 * s, -4 * s, 24 * s, 5.5 * s);

            }
          } else if (item.id === 'rocket_launcher') {

            ctx.strokeStyle = '#1e3a10';

            ctx.strokeRect(-14 * s, -5 * s, 22 * s, 9 * s);

            ctx.moveTo(8 * s, -5 * s);
            ctx.lineTo(15 * s, -0.5 * s);
            ctx.lineTo(8 * s, 4 * s);

            // Tutamaklar

            ctx.fillRect(4 * s, -4 * s, 12 * s, 3 * s);
            ctx.fillRect(4 * s, -1 * s, 10 * s, 2.5 * s);

      } else if (item.type === 'ammo') {

        ctx.fillStyle = '#166534';
        ctx.fillRect(-10 * s, -4 * s, 15 * s, 12 * s);
        ctx.strokeStyle = '#14532d';
        ctx.strokeRect(-10 * s, -4 * s, 15 * s, 12 * s);
        ctx.fillStyle = '#eab308';
        ctx.fillRect(-7 * s, -6 * s, 9 * s, 2 * s);
        ctx.fillRect(-4 * s, 1 * s, 3 * s, 3 * s);
        // Fişekler
        ctx.fillStyle = '#facc15';
        ctx.fillRect(7 * s, -2 * s, 3.5 * s, 10 * s);
        ctx.fillRect(11 * s, 0, 3.5 * s, 8 * s);
        ctx.fillStyle = '#ea580c';
        ctx.beginPath();
        ctx.moveTo(7 * s, -2 * s);
        ctx.lineTo(8.75 * s, -5 * s);
        ctx.lineTo(10.5 * s, -2 * s);
        ctx.fill();
      } else if (item.type === 'medkit') {
        // Medkit Çantası (Renge ve güce göre farklı modelleme)
        if (item.healAmount >= 100) {
          // Büyük Medkit (Destansı - Mor / Yüksek Teknoloji Askeri Travma Kiti)
          ctx.fillStyle = '#2e1065';
          ctx.fillRect(-12 * s, -9 * s, 24 * s, 18 * s);
          ctx.strokeStyle = '#a855f7';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(-12 * s, -9 * s, 24 * s, 18 * s);
          // Taşıma kulpu
          ctx.fillStyle = '#c084fc';
          ctx.fillRect(-4 * s, -12 * s, 8 * s, 3 * s);
          // Neon Yeşil EKG Kalp Atışı Çizgisi
          ctx.strokeStyle = '#4ade80';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-9 * s, 0);
          ctx.lineTo(-4 * s, 0);
          ctx.lineTo(-2 * s, -5 * s);
          ctx.lineTo(1 * s, 5 * s);
          ctx.lineTo(3 * s, 0);
          ctx.lineTo(9 * s, 0);
          ctx.stroke();
        } else if (item.healAmount >= 50) {
          // Orta Medkit (Nadir - Mavi Saha Sıhhiye Çantası)
          ctx.fillStyle = '#1e3a8a';
          ctx.fillRect(-11 * s, -8 * s, 22 * s, 16 * s);
          ctx.strokeStyle = '#3b82f6';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(-11 * s, -8 * s, 22 * s, 16 * s);
          // Kulpu
          ctx.fillStyle = '#60a5fa';
          ctx.fillRect(-4 * s, -11 * s, 8 * s, 3 * s);
          // Beyaz zeminli mavi artı
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(-6 * s, -6 * s, 12 * s, 12 * s);
          ctx.fillStyle = '#2563eb';
          ctx.fillRect(-2 * s, -4.5 * s, 4 * s, 9 * s);
          ctx.fillRect(-4.5 * s, -2 * s, 9 * s, 4 * s);
        } else {
          // Küçük Medkit (Sıradan - Gri / Kırmızı Standart İlk Yardım Kiti)
          ctx.fillStyle = '#334155';
          ctx.fillRect(-10 * s, -8 * s, 20 * s, 16 * s);
          ctx.strokeStyle = '#94a3b8';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(-10 * s, -8 * s, 20 * s, 16 * s);
          // Kulpu
          ctx.fillStyle = '#64748b';
          ctx.fillRect(-3.5 * s, -10.5 * s, 7 * s, 2.5 * s);
          // Kırmızı zeminli beyaz ilk yardım artısı
          ctx.fillStyle = '#dc2626';
          ctx.fillRect(-5 * s, -5 * s, 10 * s, 10 * s);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(-1.5 * s, -3.5 * s, 3 * s, 7 * s);
          ctx.fillRect(-3.5 * s, -1.5 * s, 7 * s, 3 * s);
        }
      } else if (item.type === 'helmet') {
        // Taktik Balistik Kask
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(0, 0, 10 * s, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(-10 * s, 0, 20 * s, 4 * s);
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(-7 * s, 2 * s, 14 * s, 4 * s);
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillRect(-5 * s, 3 * s, 4 * s, 1.5 * s);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-3 * s, -8 * s, 6 * s, 4 * s);
      } else if (item.type === 'armor') {
        // Taktik Çelik Yelek
        ctx.fillStyle = color;
        ctx.fillRect(-10 * s, -10 * s, 20 * s, 20 * s);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-4 * s, -10 * s, 8 * s, 5 * s);
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-8 * s, -1 * s);
        ctx.lineTo(8 * s, -1 * s);
        ctx.moveTo(-8 * s, 4 * s);
        ctx.lineTo(8 * s, 4 * s);
        ctx.stroke();
        ctx.fillStyle = '#334155';
        ctx.fillRect(-7 * s, 5 * s, 4 * s, 5 * s);
        ctx.fillRect(-2 * s, 5 * s, 4 * s, 5 * s);
        ctx.fillRect(3 * s, 5 * s, 4 * s, 5 * s);
      } else if (item.type === 'outfit') {
        // Kamuflaj Kıyafet
        ctx.fillStyle = color;
        ctx.fillRect(-8 * s, -10 * s, 16 * s, 8 * s);
        ctx.fillRect(-8 * s, -2 * s, 6.5 * s, 12 * s);
        ctx.fillRect(1.5 * s, -2 * s, 6.5 * s, 12 * s);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-7 * s, 2 * s, 4.5 * s, 4 * s);
        ctx.fillRect(2.5 * s, 2 * s, 4.5 * s, 4 * s);
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(-8 * s, 8 * s, 6.5 * s, 4 * s);
        ctx.fillRect(1.5 * s, 8 * s, 6.5 * s, 4 * s);
      } else if (item.type === 'backpack') {
        // Taktik Sırt Çantası
        ctx.fillStyle = color;
        ctx.fillRect(-9 * s, -8 * s, 18 * s, 18 * s);
        ctx.fillStyle = '#475569';
        ctx.beginPath();
        ctx.ellipse(0, -9 * s, 9 * s, 3.5 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#334155';
        ctx.fillRect(-12 * s, -4 * s, 3 * s, 11 * s);
        ctx.fillRect(9 * s, -4 * s, 3 * s, 11 * s);
        ctx.strokeStyle = '#f8fafc';
        ctx.lineWidth = 1;
        ctx.strokeRect(-6 * s, -3 * s, 12 * s, 10 * s);
      }

      ctx.restore();
    }
  }

  // ==========================================
  // 9. PLAYER
  // ==========================================
  class Player {
    constructor() {
      this.x = 2800; // 6000 px dünyanın ortasında başlar
      this.y = CONFIG.gameplay.groundY;
      this.vx = 0;
      this.vy = 0;
      this.width = 24;
      this.height = 48;
      this.isGrounded = true;
      this.facingRight = true;

      this.hp = CONFIG.player.baseHp;
      this.maxHp = CONFIG.player.baseHp;
      this.stamina = CONFIG.player.baseStamina;
      this.maxStamina = CONFIG.player.baseStamina;
      this.staminaRegenDelayTimer = 0;

      // 3 Hand Slot
      this.handSlots = [null, null, null];
      this.activeHandIndex = 0;

      // Yedek Mermiler (silah tipine göre)
      this.ammo = {
        pistol: CONFIG.firearms.pistol.defaultReserve,
        rifle: CONFIG.firearms.m4a1.defaultReserve,
        rocket: CONFIG.firearms.rocket_launcher.defaultReserve,
        shotgun: CONFIG.firearms.shotgun.defaultReserve
      };

      // Silah kullanım sayaçları
      this.fireTimer = 0;
      this.isReloading = false;
      this.reloadTimer = 0;

      // Medkit kullanımı (1.2 sn)
      this.isHealing = false;
      this.healTimer = 0;
      this.healingItem = null;
      this.healingSlot = null;

      // Kılıç savurma animasyonu
      this.isSlashing = false;
      this.slashTimer = 0;
      this.slashAngle = 0;
      this.slashRange = 70;
      this.slashIsLegendary = false;

      // Animasyon yürüme döngüsü
      this.walkAnimTime = 0;
      this.hasFiredThisClick = false;

      // Level & XP Sistemi
      this.level = 1;
      this.xp = 0;
      this.xpNeeded = 50;

      // 3 Özel Yetenek (Maksimum 3 Seviye)
      this.skills = {
        superdash: 0,      // [Q] Super Dash (cooldown azalır, mesafe artar)
        big_ammo: 0,       // Big Ammo (+3/+6/+9 Şarjör Kapasitesi)
        power_shield: 0    // [F] Power Shield (3s / 3.5s / 4s Hasarsızlık)
      };

      // Super Dash Durumu
      this.isDashing = false;
      this.dashTimer = 0;
      this.dashCooldownTimer = 0;
      this.dashSpeed = 0;

      // Power Shield Durumu
      this.shieldActiveTimer = 0;
      this.shieldCooldownTimer = 0;
    }

    addXp(amount) {
      this.xp += amount;
      window.game.particles.addFloatingText(`+${amount} XP`, this.x, this.y - 50, '#38bdf8');
      while (this.xp >= this.xpNeeded) {
        this.xp -= this.xpNeeded;
        this.level++;
        this.xpNeeded = Math.round(50 * Math.pow(this.level, 1.25));
        window.game.onLevelUp();
      }
    }

    activateSuperDash() {
      if (this.skills.superdash <= 0) {
        window.game.particles.addFloatingText('Super Dash kilitli! (Level atlayınca seçin)', this.x, this.y - 45, '#94a3b8');
        return;
      }
      if (this.dashCooldownTimer > 0) {
        window.game.particles.addFloatingText(`Dash Beklemede: ${this.dashCooldownTimer.toFixed(1)}s`, this.x, this.y - 45, '#facc15');
        return;
      }
      const cds = [0, 6.0, 4.5, 3.0];
      const dists = [0, 260, 310, 360];
      const lvl = Math.min(3, Math.max(1, this.skills.superdash));
      this.dashCooldownTimer = cds[lvl] || 6.0;
      this.dashTimer = 0.16;
      this.isDashing = true;
      const dir = this.facingRight ? 1 : -1;
      this.dashSpeed = (dists[lvl] / 0.16) * dir;
      sound.playDash();
      window.game.camera.shake(5, 0.15);
      window.game.particles.addFloatingText('⚡ SUPER DASH!', this.x, this.y - 45, '#38bdf8');
    }

    activatePowerShield() {
      if (this.skills.power_shield <= 0) {
        window.game.particles.addFloatingText('Power Shield kilitli! (Level atlayınca seçin)', this.x, this.y - 45, '#94a3b8');
        return;
      }
      if (this.shieldCooldownTimer > 0) {
        window.game.particles.addFloatingText(`Kalkan Beklemede: ${this.shieldCooldownTimer.toFixed(1)}s`, this.x, this.y - 45, '#facc15');
        return;
      }
      const durations = [0, 3.0, 3.5, 4.0];
      const lvl = Math.min(3, Math.max(1, this.skills.power_shield));
      this.shieldActiveTimer = durations[lvl] || 3.0;
      this.shieldCooldownTimer = 15.0; // 15 saniye bekleme
      sound.playShield();
      window.game.particles.addFloatingText('🛡️ POWER SHIELD AKTİF!', this.x, this.y - 45, '#38bdf8');
    }

    upgradeSkill(skillKey) {
      if (skillKey === 'big_ammo') {
        const bonus = this.skills.big_ammo * 3;
        for (let i = 0; i < 3; i++) {
          const wp = this.handSlots[i];
          if (wp && wp.subType === 'gun') {
            wp.baseMagSize = wp.baseMagSize || wp.magSize;
            wp.magSize = wp.baseMagSize + bonus;
            wp.currentMag = Math.min(wp.magSize, (wp.currentMag || 0) + 3);
          }
        }
        if (window.game && window.game.inventory) {
          for (let i = 0; i < window.game.inventory.grid.length; i++) {
            const item = window.game.inventory.grid[i];
            if (item && item.type === 'weapon' && item.subType === 'gun') {
              item.baseMagSize = item.baseMagSize || item.magSize;
              item.magSize = item.baseMagSize + bonus;
            }
          }
        }
      }
    }

    applyBigAmmoToWeapon(weapon) {
      if (!weapon || weapon.subType !== 'gun') return weapon;
      weapon.baseMagSize = weapon.baseMagSize || weapon.magSize;
      weapon.magSize = weapon.baseMagSize + (this.skills.big_ammo * 3);
      return weapon;
    }

    getTotalArmor() {
      if (!window.game) return 0;
      const eq = window.game.inventory.equipment;
      let total = 0;
      if (eq.helmet) total += eq.helmet.armorValue || 0;
      if (eq.armor) total += eq.armor.armorValue || 0;
      if (eq.outfit) total += eq.outfit.armorValue || 0;
      if (this.bonusArmor) total += this.bonusArmor;
      return Math.min(CONFIG.player.maxArmor, total);
    }

    getActiveWeapon() {
      const wp = this.handSlots[this.activeHandIndex];
      if (wp && wp.subType === 'gun') {
        return this.applyBigAmmoToWeapon(wp);
      }
      return wp;
    }

    setActiveHand(index) {
      if (index >= 0 && index <= 2) {
        this.activeHandIndex = index;
        this.isReloading = false;
        sound.playItemUse();
      }
    }

    takeDamage(amount) {
      // 1. Power Shield veya Super Dash aktifken hasar 0!
      if (this.shieldActiveTimer > 0 || this.isDashing) {
        window.game.particles.addFloatingText('BLOKLANDI!', this.x, this.y - 45, '#38bdf8');
        sound.playDeflect();
        return;
      }

      const armor = this.getTotalArmor();
      const finalDmg = amount * (1 - armor / 100);
      this.hp -= finalDmg;
      sound.playPlayerHurt();
      window.game.camera.shake(6, 0.2);
      window.game.particles.addBlood(this.x, this.y - 25, 6);
      window.game.particles.addFloatingText(`-${Math.round(finalDmg)}`, this.x, this.y - 45, '#ef4444');

      if (this.hp <= 0) {
        this.hp = 0;
        window.game.setGameOver();
      }
    }

    useMedkit(medkitItem, slot) {
      if (this.hp >= this.maxHp) {
        window.game.particles.addFloatingText('Canınız zaten dolu!', this.x, this.y - 40, '#facc15');
        return;
      }
      if (this.isHealing) return;

      this.isHealing = true;
      this.healTimer = 1.2; // 1.2 sn kullanım
      this.healingItem = medkitItem;
      this.healingSlot = slot;
      sound.playItemUse();
    }

    reload() {
      const weapon = this.getActiveWeapon();
      if (!weapon || weapon.subType !== 'gun') return;
      if (this.isReloading) return;

      const reserve = this.ammo[weapon.ammoType] || 0;
      if (reserve <= 0) {
        sound.playEmptyClick();
        window.game.particles.addFloatingText('Yedek mermi yok!', this.x, this.y - 40, '#ef4444');
        return;
      }

      if (weapon.currentMag >= weapon.magSize) {
        window.game.particles.addFloatingText('Şarjör dolu!', this.x, this.y - 40, '#facc15');
        return;
      }

      this.isReloading = true;
      this.reloadTimer = weapon.reloadTimePerShell || weapon.reloadTime;
      sound.playReload();
    }

    update(dt, input) {
      // Superdash fizik güncellemesi
      if (this.isDashing) {
        this.dashTimer -= dt;
        this.vx = this.dashSpeed;
        this.vy = 0;
        if (this.dashTimer <= 0) {
          this.isDashing = false;
        }
      }

      // Yetenek bekleme ve aktiflik süreleri
      if (this.dashCooldownTimer > 0) this.dashCooldownTimer -= dt;
      if (this.shieldCooldownTimer > 0) this.shieldCooldownTimer -= dt;
      if (this.shieldActiveTimer > 0) this.shieldActiveTimer -= dt;

      // 1. Yatay hareket (A / D, Shift koşma - Dash sırasında normal hareket kilitlenir)
      if (!this.isDashing) {
        const isShift = input.isActionDown('sprint') || input.keys['ShiftLeft'] || input.keys['ShiftRight'];
        const canRun = isShift && this.stamina > 0;
        let speed = CONFIG.player.walkSpeed;

        let moveDir = 0;
        if (input.isActionDown('moveLeft') || input.keys['KeyA']) moveDir -= 1;
        if (input.isActionDown('moveRight') || input.keys['KeyD']) moveDir += 1;

        if (moveDir !== 0) {
          if (canRun) {
            speed = CONFIG.player.runSpeed;
            this.stamina = Math.max(0, this.stamina - CONFIG.player.runStaminaDrain * dt);
            this.staminaRegenDelayTimer = CONFIG.player.staminaRegenDelay;
          }
          this.vx = moveDir * speed * (this.speedMultiplier || 1.0);
          this.walkAnimTime += dt * (canRun ? 16 : 10);
        } else {
          this.vx = 0;
        }
      }

      // Yüz yönü mouse hedefine bakar
      const mousePos = window.game.camera.screenToWorld(input.mouseX, input.mouseY);
      this.facingRight = mousePos.x >= this.x;

      // 2. Zıplama (W / Space)
      const isJumpKey = input.isActionDown('jump') || input.keys['KeyW'] || input.keys['Space'];
